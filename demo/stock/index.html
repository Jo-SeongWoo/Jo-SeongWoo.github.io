<script>
'use strict';

var MK_URL = '/api/bot/market_overview';

var MK = {
  chip: 'top',
  sel: null,
  seq: 0
};

MK.majOnly = function() {
  try {
    return localStorage.getItem('m_mk_major_only') === '1';
  } catch (e) {
    return false;
  }
}();

MK.pendOnly = function() {
  try {
    return localStorage.getItem('m_mk_pend_only') === '1';
  } catch (e) {
    return false;
  }
}();

function mkSetFilt(maj, pend) {
  MK.majOnly = !!maj;
  MK.pendOnly = !!pend;
  try {
    localStorage.setItem('m_mk_major_only', maj ? '1' : '0');
    localStorage.setItem('m_mk_pend_only', pend ? '1' : '0');
  } catch (e) {}
  if (TAB === 'market' && MK.sel) renderMarketGroup(false);
}

function mkPct(v) {
  return v == null || !isFinite(Number(v)) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%';
}

function mkCls(v) {
  return v == null ? 'mut' : v > 0 ? 'up' : v < 0 ? 'dn' : '';
}

function mkNum(v) {
  return v == null || !isFinite(Number(v)) ? '—' : Number(v).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function mkMd(ymd) {
  var s = String(ymd || '').replace(/-/g, '');
  return s.length >= 8 ? +s.slice(4, 6) + '/' + +s.slice(6, 8) : s;
}

function mkWhy(d) {
  var why = d.__err ? d.__err.message || String(d.__err) : d.error || '답이 비었습니다';
  return /HTTP 404/.test(why) ? '컴퓨터 서버를 다시 켠 뒤에 나옵니다 (HTTP 404)' : why;
}

function mkMiss(lm, dim) {
  return !!(lm && lm[dim]);
}

function mkHm(s) {
  var m = /(\d{1,2}):(\d{2})/.exec(String(s || ''));
  return m ? ('0' + m[1]).slice(-2) + ':' + m[2] : '';
}

function mkTail(r, lm) {
  var t = [];
  if (r.src === 'final' && (MK._live || mkMiss(lm, r.dim))) t.push('지난 거래일 값');
  if (r.nolive && r.chg == null) t.push('실시간 없음');
  if (r.carried && r.src === 'live') t.push((mkHm(r.live_at) || '앞 회차') + ' 값');
  return t;
}

function mkWarn(lm, at) {
  if (!lm || !(lm.theme || lm.upjong)) return null;
  var both = lm.theme && lm.upjong, hm = mkHm(at);
  var w = el('div', 'mk-warn');
  w.setAttribute('data-mk-nolive', both ? 'all' : lm.theme ? 'theme' : 'upjong');
  w.appendChild(el('div', 'mk-warn-t', '⚠ ' + (both ? '' : lm.theme ? '테마 ' : '업종 ') + '실시간 등락률을 아직 못 받았습니다 — ' + (both ? '' : lm.theme ? '테마는 ' : '업종은 ') + '지난 거래일 값입니다' + (hm ? '(' + hm + ' 기준)' : '')));
  if (lm.why) w.appendChild(el('div', 'mk-warn-w', lm.why));
  return w;
}

function mkGroupUrl(sel) {
  return '/api/bot/market_group?dim=' + encodeURIComponent(sel.dim) + '&name=' + encodeURIComponent(sel.name);
}

function mkFresh(url, ac) {
  return getJSON(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'fresh=1', ac).then((function(d) {
    if (ac && ac.signal.aborted) throw jcCutErr();
    JC[url] = {
      ts: Date.now(),
      data: d,
      forcedAt: Date.now()
    };
    return d;
  }));
}

var MK_OPEN = {
  p: null,
  err: null,
  at: 0,
  cut: null
};

var MK_OLD_MAX = 6e5;

function mkOpenLive() {
  if (MK_OPEN.p && Date.now() - MK_OPEN.at >= JC_BUSY_MAX && MK_OPEN.cut) MK_OPEN.cut();
  return MK_OPEN.p;
}

function mkOpenFetch() {
  warmLearn(MK_URL);
  var lp = mkOpenLive();
  if (lp) return lp;
  var ac = jcCutter(), tmo = null, cutRej = null;
  var cutP = new Promise((function(_, rej) {
    cutRej = rej;
  }));
  var p = Promise.race([ mkFresh(MK_URL, ac), cutP ]).then((function(d) {
    if (MK_OPEN.p === p) MK_OPEN.err = null;
    return d;
  }), (function(e) {
    if (MK_OPEN.p === p) MK_OPEN.err = {
      e: e,
      at: Date.now()
    };
    throw e;
  }));
  var cut = function() {
    clearTimeout(tmo);
    if (MK_OPEN.p !== p) return;
    MK_OPEN.p = null;
    MK_OPEN.cut = null;
    MK_OPEN.err = {
      e: jcCutErr(),
      at: Date.now()
    };
    ac.abort();
    cutRej(jcCutErr());
  };
  MK_OPEN.p = p;
  MK_OPEN.at = Date.now();
  MK_OPEN.cut = cut;
  tmo = setTimeout(cut, JC_BUSY_MAX);
  p.catch((function() {})).then((function() {
    clearTimeout(tmo);
    if (MK_OPEN.p === p) {
      MK_OPEN.p = null;
      MK_OPEN.cut = null;
    }
  }));
  return p;
}

function mkOpenStale(d) {
  var er = MK_OPEN.err, c = JC[MK_URL];
  if (!er || !c || c.ts > er.at || !d || d.__err) return null;
  var why = er.e && er.e.message ? er.e.message : String(er.e || '');
  var w = el('div', 'mk-warn');
  w.setAttribute('data-mk-stale', '1');
  w.appendChild(el('div', 'mk-warn-t', '⚠ 새 값을 못 받았습니다 — ' + (d.at ? d.at + ' 기준' : '조금 전 값')));
  if (why) w.appendChild(el('div', 'mk-warn-w', why));
  return w;
}

function mkSync(field) {
  try {
    var b = {};
    b[field] = true;
    fetch('/api/sync_stock', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(b)
    }).catch((function() {}));
  } catch (e) {}
}

function mkPost(url, body, done) {
  fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    var ok = r.ok;
    return r.json().then((function(d) {
      return {
        ok: ok,
        d: d
      };
    }), (function() {
      return {
        ok: false,
        d: null
      };
    }));
  })).then((function(res) {
    var d = res.d;
    if (!res.ok || !d || d.error || d.verify_skip) {
      say('★ 를 바꾸지 못했습니다 — ' + (d && (d.msg || d.error) || '서버가 받지 않았습니다'));
      done(false);
      return;
    }
    done(true, d);
  })).catch((function(e) {
    say('★ 를 바꾸지 못했습니다 — ' + (e && e.message ? e.message : e));
    done(false);
  }));
}

function mkStarGroup(row, btn) {
  var want = !row.major, what = row.dim === 'upjong' ? '주요업종' : '주요테마';
  btn.disabled = true;
  mkPost('/api/interest_themes/theme_bookmark', {
    name: row.name,
    bookmarked: want,
    dim: row.dim
  }, (function(ok) {
    if (!ok) {
      btn.disabled = false;
      return;
    }
    row.major = want;
    (MK_ALL.data && MK_ALL.data.rows || []).forEach((function(r) {
      if (r !== row && r.name === row.name && (r.dim || 'theme') === (row.dim || 'theme')) r.major = want;
    }));
    mkSync('major_themes_changed');
    toast((want ? '★ ' + what + ' 표시됨 — ' : '☆ ' + what + ' 해제됨 — ') + (row.name || ''));
    var jobs = [ mkFresh(MK_URL) ];
    if (MK.sel) jobs.push(mkFresh(mkGroupUrl(MK.sel)));
    Promise.all(jobs).catch((function() {})).then((function() {
      if (TAB === 'market') renderMarket();
    }));
  }));
}

function mkStarStock(s, btn) {
  var want = !s.major;
  btn.disabled = true;
  mkPost('/api/interest_themes/bookmark', {
    code: s.code,
    name: s.name,
    bookmarked: want
  }, (function(ok, d) {
    if (!ok) {
      btn.disabled = false;
      return;
    }
    s.major = !!d.bookmarked;
    mkSync('major_changed');
    toast((s.major ? '★ 주요개별종목 표시됨 — ' : '☆ 주요개별종목 해제됨 — ') + (s.name || ''));
    dropCache();
    var _mjp = mkFresh('/api/bot/major_stocks').catch((function() {}));
    (MK.sel ? mkFresh(mkGroupUrl(MK.sel)) : MK.chip === 'stars' ? _mjp : Promise.resolve()).catch((function() {})).then((function() {
      if (TAB === 'market') renderMarket();
    }));
  }));
}

function mkStarBtn(on, fn) {
  var b = el('button', 'mk-star' + (on ? ' on' : ''), on ? '★' : '☆');
  b.title = on ? '주요 표시 해제' : '주요 표시';
  b.onclick = function(e) {
    e.stopPropagation();
    fn(b);
  };
  return b;
}

function mkStCls(it) {
  if (!it || !it.judge) return 'st-none';
  if (/^리셋/.test(String(it.judge))) return 'st-reset';
  var s = it.state !== undefined ? it.state : String(it.judge).split('(')[0];
  s = String(s || '').toUpperCase().replace(/[\s-]/g, '');
  if (!s) return 'st-none';
  if (s === 'DAY1') return 'st-day1';
  if (s === 'FTD') return 'st-good';
  if (s === 'SEMIFTD') return 'st-semi';
  if (s === 'DD') return 'st-bad';
  return 'st-neutral';
}

function mkIndexCards(ix) {
  var f = document.createDocumentFragment();
  var g = el('div', 'mk-idx'), live_ = ix.mode === 'intraday', pre_ = ix.mode === 'pre';
  (ix.items || []).forEach((function(it) {
    var stc = mkStCls(it);
    var c = el('div', 'mk-ic ' + stc);
    c.setAttribute('data-ix', it.key || '');
    c.setAttribute('data-st', stc);
    c.appendChild(el('div', 'n', it.name || ''));
    c.appendChild(el('div', 'v', pre_ ? '—' : mkNum(it.value)));
    var pts = !pre_ && it.value != null && it.prev != null ? it.value - it.prev : null;
    c.appendChild(el('div', 'c' + (pre_ ? ' mut' : ''), (pre_ || it.chg_pct == null ? '—' : (it.chg_pct > 0 ? '▲ ' : it.chg_pct < 0 ? '▼ ' : '') + mkPct(it.chg_pct)) + (pts == null ? '' : '  ' + (pts > 0 ? '+' : '') + pts.toFixed(2))));
    var jt, jc = 'j';
    var op_ = /^\d\d:\d\d$/.test(String(ix.open || '')) ? String(ix.open) : '09:00';
    var pf_ = /^\d\d:\d\d$/.test(String(ix.pre_from || '')) ? String(ix.pre_from) : '07:00';
    if (pre_) {
      jt = '장 전 · ' + op_ + ' 시작';
      jc += ' pre';
    } else if (!it.judge) {
      jt = '판정을 못 읽었습니다';
      jc += ' none';
    } else if (live_) {
      jt = it.judge;
      jc += ' live';
    } else {
      jt = it.judge;
      jc += ' fin';
      if (it.day != null && !/^Day ?1\b/i.test(it.judge)) jt += ' · Day ' + it.day;
    }
    var jb = el('div', jc, jt);
    function why() {
      if (pre_) {
        say([ it.name + '  —', '', '⏳ 장 전 (' + op_ + ' 시작)', '', '장 열리는 날 ' + pf_ + '~' + op_ + ' 에는 어제 값을 지우고 비워 둡니다.', op_ + ' 에 장이 열리면 마감예상 판정으로 바뀝니다.' ].join('\n'));
        return;
      }
      var L = [ it.name + ' ' + mkNum(it.value) + '  ' + mkPct(it.chg_pct), '' ];
      if (live_) {
        L.push('⏱ 마감예상 ' + (it.judge || '—') + ' (아직 확정 아님)');
        (it.more || []).forEach((function(m) {
          L.push('• ' + m);
        }));
        L.push('', '장중에는 봇 «당일 마감 예상» 과 같은 판정을 보여 줍니다' + (ix.asof ? ' (' + ix.asof + ' 기준)' : '') + '.', '장이 끝나면(15:30) 확정 판정으로 바뀝니다.');

<script>

  rows.forEach((function(o) {

        return;

    ids: ids,

function obkNames(a) {

}

var OBK_DEF_MIN = 8e5;

var ORD_CAPS = {};

var ORD_CAP_TTL = 3e4;

function ordBetKind(o, defV) {
  var op = Number(o && o.order_price) || 0, q = Number(o && o.quantity) || 0;
  if (!(defV > 0) || !(op > 0) || !(q > 0)) return '';
  var dq = obkDefQ(op, defV);
  if (q === dq) return 'def';
  if (q > dq) return '';
  var c = ORD_CAPS[o.code];

  return c.known && c.held && c.cap > 0 && dq * op > c.cap ? 'cap' : '';
}

function ordCapFetch(codes, then) {
  var now = Date.now(), need = [];
  codes.forEach((function(c) {
    var x = ORD_CAPS[c];
    if (c && need.indexOf(c) < 0 && !(x && x.busy) && (!x || !x.at || now - x.at > ORD_CAP_TTL)) need.push(c);
  }));
  if (!need.length) return;
  need.forEach((function(c) {
    ORD_CAPS[c] = Object.assign({
      at: 0
    }, ORD_CAPS[c] || {}, {
      busy: true
    });
  }));
  Promise.all(need.map((function(c) {
    return fetch('/api/addon_cap?code=' + encodeURIComponent(c), {
      cache: 'no-store'
    }).then((function(r) {
      return r.ok ? r.json() : null;
    })).catch((function() {
      return null;
    })).then((function(j) {
      ORD_CAPS[c] = {
        at: Date.now(),
        known: !!(j && j.known),
        held: !!(j && j.held),
        cap: Number(j && (j.cap != null ? j.cap : j.principal)) || 0
      };
    }));
  }))).then((function() {
    if (then) then();
  }));
}

function obkFollowPick(list, oldDef, newDef) {
  var out = [];
  (list || []).forEach((function(o) {
    var op = Number(o.order_price) || 0, t = Number(o.total_amount) || 0, q = Number(o.quantity) || 0;
    if (!(op > 0) || !(q > 0) || !(newDef > 0) || newDef === oldDef) return;
    if (t > obkDefQ(op, oldDef) * op + .5) return;
    var nq = obkDefQ(op, newDef);
    if (newDef < oldDef ? !(nq < q) : !(nq > q)) return;
    out.push(o);
  }));
  return out;
}

function obkPlan(rows, delta, defV, pct) {
  var nd = obkNewAmt({
    total_amount: defV
  }, delta, pct);
  var fol = obkFollowPick(rows, defV, nd), fs = {};
  fol.forEach((function(o) {
    fs[String(o.order_id)] = 1;
  }));
  var up = pct == null ? delta > 0 : pct > 0, sum = 0, est = 0, inSet = {};
  var same = [];
  var rest = rows.filter((function(o) {
    if (fs[String(o.order_id)]) return false;
    if (up) {
      var op = Number(o.order_price) || 0, t = Number(o.total_amount) || 0, q = Number(o.quantity) || 0;
      if (op > 0 && q > 0 && t <= obkDefQ(op, defV) * op + .5) {
        same.push(o);
        return false;
      }
    }
    return true;
  }));
  var sp = obkSplit(rest, delta, nd, pct);
  sp.ids.forEach((function(id) {
    inSet[id] = 1;
  }));
  rows.forEach((function(o) {
    var op = Number(o.order_price) || 0, t = Number(o.total_amount || o.base_amount || 0);
    sum += t;
    if (fs[String(o.order_id)]) {
      est += op > 0 ? obkDefQ(op, nd) * op : t;
      return;
    }
    if (!inSet[String(o.order_id)]) {
      est += t;
      return;
    }
    var na = obkNewAmt(o, delta, pct);
    if (!up && op > 0) na = Math.min(Math.max(na, obkDefQ(op, nd) * op), t);
    est += na;
  }));
  return {
    nd: nd,
    up: up,
    fol: fol,
    same: same,
    sp: sp,
    sum: sum,
    est: est,
    low: nd < OBK_DEF_MIN

}

function obkSkipTxt(j) {

}

  var unit = 'man';

  function man() {

  function fillQuick() {

  fillQuick();
  inp.oninput = function() {

  function paintPct() {
    var c = pctNow(), p = c.v || 0;

        prev.appendChild(el('div', 'mut', '감액은 기본 ' + manWon(def.v) + '에서 멈춥니다 · 이미 기본 미만 ' + sp.below.length + '건' + (sp.below.length ? '(감액에서 뺌)' : '')));
        dnOk = true;
      } else if (def.err) {
        prev.appendChild(el('div', 'bad', '기본 베팅액을 못 읽었습니다 — ' + def.err + ' · 창을 닫았다 다시 열어 주세요'));
      } else {
        prev.appendChild(el('div', 'mut', '기본 베팅액 읽는 중…'));
      }
      prev.appendChild(el('div', 'mut', '주문마다 지금 베팅액의 ' + p + '% · 새 금액은 만원 단위로 반올림 · 보유 종목은 추가 매수 한도까지만 · 실제 금액은 주 단위로 맞춥니다'));
    }
    bUp.textContent = '＋ ' + (p ? p + '%' : '') + ' 증액';
    bDn.textContent = '－ ' + (p ? p + '%' : '') + ' 감액';
    var base = !!(def.v && rows.length);
    bUp.disabled = !base;
    bDn.disabled = !base;
    bUp.classList.toggle('dim', !upOk);
    bDn.classList.toggle('dim', !dnOk);
  }
  function paint() {
    if (unit === 'pct') return paintPct();
    var m = man(), d = m * 1e4;
    if (m) OBK_MAN = m;
    [].forEach.call(quick.children, (function(b) {
      b.className = Number(b.getAttribute('data-man')) === m ? 'on' : '';
    }));
    var sum = 0;
    rows.forEach((function(o) {
      sum += Number(o.total_amount || o.base_amount || 0);
    }));
    prev.textContent = '';
    var _pw = null;
    if (!m) {
      prev.appendChild(el('div', 'bad', '금액을 넣어 주세요 (만원 단위 · 예 50)'));
    } else if (wcb.checked && def.v) {
      _pw = prevWith(d, null);
    } else {
      prev.appendChild(el('div', '', '증액하면 합계 ' + manWon(sum) + ' → 약 ' + manWon(sum + rows.length * d) + ' (+' + manWon(rows.length * d) + ')'));
      if (def.v) {
        var sp = obkSplit(rows, -d, def.v), dsum = sum;
        var inSet = {};
        sp.ids.forEach((function(id) {
          inSet[id] = 1;
        }));
        rows.forEach((function(o) {
          if (!inSet[String(o.order_id)]) return;
          var op = Number(o.order_price) || 0, t = Number(o.total_amount) || 0;
          var nt = op > 0 ? Math.max(t - d, obkDefQ(op, def.v) * op) : t - d;
          dsum += Math.min(nt, t) - t;
        }));
        prev.appendChild(el('div', '', '감액하면 합계 ' + manWon(sum) + ' → 약 ' + manWon(dsum) + ' (−' + manWon(sum - dsum) + ')'));
        prev.appendChild(el('div', 'mut', '감액은 기본 ' + manWon(def.v) + '에서 멈춥니다 · 이미 기본 미만 ' + sp.below.length + '건' + (sp.below.length ? '(감액에서 뺌)' : '')));
      } else if (def.err) {
        prev.appendChild(el('div', 'bad', '기본 베팅액을 못 읽었습니다 — ' + def.err + ' · 창을 닫았다 다시 열어 주세요'));
      } else {
        prev.appendChild(el('div', 'mut', '기본 베팅액 읽는 중…'));
      }
      prev.appendChild(el('div', 'mut', '보유 종목은 추가 매수 한도까지만 올립니다 · 실제 금액은 주 단위로 맞춥니다'));
    }
    bUp.textContent = '＋ ' + (m ? m + '만원' : '') + ' 증액';
    bDn.textContent = '－ ' + (m ? m + '만원' : '') + ' 감액';
    var ready = !!(m && def.v && rows.length);
    bUp.disabled = !ready;
    bDn.disabled = !ready;
    bUp.classList.remove('dim');
    bDn.classList.remove('dim');
    if (_pw && !_pw.dnOk) bDn.classList.add('dim');
  }
  function pctGo(down) {
    var c = obkPctOf(inp.value, down ? -1 : 1);
    var why = c.why || ((down ? c.v >= 100 : c.v > 100) ? obkPctWhyFull(c.v, down) : '');
    var kw = wcb.checked;
    if (why) {
      OBK_PCT = String(inp.value);
      say(why, (function() {
        ordBulkSheet(rows, label, kw);
      }));
      return;
    }
    if (kw) {
      obkGoWith(rows, label, 0, def.v, down ? -c.v : c.v);
      return;
    }
    obkGo(rows, label, 0, def.v, down ? -c.v : c.v);
  }
  bUp.onclick = function(e) {
    e.stopPropagation();

    if (unit === 'pct') {
      pctGo(false);
      return;
    }
    if (wcb.checked) {
      obkGoWith(rows, label, man() * 1e4, def.v);

    }
    obkGo(rows, label, man() * 1e4, def.v);
  };
  bDn.onclick = function(e) {

    if (unit === 'pct') {
      pctGo(true);
      return;
    }
    if (wcb.checked) {
      obkGoWith(rows, label, -man() * 1e4, def.v);

    }
    obkGo(rows, label, -man() * 1e4, def.v);
  };
  setUnit(OBK_UNIT === 'pct' ? 'pct' : 'man');
  fetch('/api/default_bet', {
    cache: 'no-store'
  }).then((function(r) {
    return r.ok ? r.json() : Promise.reject(new Error('응답 ' + r.status));
  })).then((function(j) {
    var v = Number(j && j.value) || 0;
    if (v > 0) def.v = v; else def.err = '값 없음';
  })).catch((function(e) {
    def.err = e && e.message || '연결 실패';
  })).then((function() {
    if (!alive()) return;
    if (def.v) {
      var _dm = String(Math.round(def.v / 1e4));
      dinp.value = _dm;
      dinp.setAttribute('data-orig', _dm);
    }
    paintDef();
    paint();
  }));
}

function obkGo(rows, label, delta, defBet, pct) {
  var isP = pct != null;
  var m = Math.abs(delta) / 1e4, up = isP ? pct > 0 : delta > 0;
  var sp = obkSplit(rows, delta, defBet, isP ? pct : null);
  var why = [];
  var sheet = function() {
    ordBulkSheet(rows, label);
  };
  if (sp.below.length) why.push('· 이미 기본(' + manWon(defBet) + ') 미만 ' + sp.below.length + '건은 감액하지 않습니다 (' + obkNames(sp.below) + ')');
  if (!sp.ids.length) {
    say('감액할 것이 없습니다\n' + why.join('\n') + '\n기본보다 적게는 보유 종목의 추가 매수 한도에 걸릴 때만 걸 수 있습니다.');
    dlgBackTo(sheet);
    return;
  }
  if (sp.stop.length) why.push('· ' + sp.stop.length + '건은 기본 베팅액(' + manWon(defBet) + ')에서 멈춥니다 (' + obkNames(sp.stop) + ')');
  if (up) why.push('· 보유 종목은 추가 매수 한도까지만 올립니다');
  var expect = {};
  rows.forEach((function(o) {
    if (o.total_amount != null && o.total_amount !== '') expect[String(o.order_id)] = Number(o.total_amount);
  }));
  ask('«' + label + '» 대기 매수 ' + sp.ids.length + '건을 ' + (isP ? '각 베팅액의 ' + Math.abs(pct) + '%만큼' : m + '만원씩') + ' ' + (up ? '올립니다.' : '내립니다.') + (isP ? '\n· 새 금액은 만원 단위로 반올림합니다' : '') + (why.length ? '\n' + why.join('\n') : '') + '\n되돌리려면 컴퓨터 주문창의 [↩ 되돌리기] 가 필요합니다.', (function() {
    obkRun(sp.ids, delta, defBet, expect, isP ? pct : null);
  }), !up);
  dlgBackTo(sheet);
}

function obkPost(ids, delta, defBet, extra, pct) {
  return fetch('/api/orders/bulk_adjust', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(Object.assign(pct == null ? {
      order_ids: ids,
      delta_won: delta,
      min_amount: defBet
    } : {
      order_ids: ids,
      delta_pct: pct,
      min_amount: defBet
    }, extra || {}))
  }).then((function(r) {
    return r.json().catch((function() {
      return {};
    })).then((function(j) {
      return {
        r: r,
        j: j || {}
      };
    }));
  }));
}

function obkRun(ids, delta, defBet, expect, pct, head) {
  var hd = head ? head + '\n' : '';
  if (BOT.busy) return;
  BOT.busy = true;
  var isP = pct != null;
  var m = Math.abs(delta) / 1e4, lbl = isP ? (pct > 0 ? '+' : '-') + Math.abs(pct) + '%' : (delta > 0 ? '+' : '-') + m + '만원';
  var pre = {
    upd: [],
    skip: [],
    cap: []
  };
  function fail(x) {
    BOT.busy = false;
    dropCache();
    if (isP && x.j && /delta_won required/.test(String(x.j.error || ''))) {
      say(hd + OBK_PCT_OLD, (function() {
        go(TAB);
      }));
      return;
    }
    say(hd + '일괄 처리 실패 — ' + (x.j && (x.j.msg || x.j.error) || '응답 ' + x.r.status), (function() {
      go(TAB);
    }));
  }
  function done(x, delZero, cancelled) {
    BOT.busy = false;
    dropCache();
    if (!x.r.ok) return fail(x);
    var j = x.j, nUpd = (j.updated || []).length + pre.upd.length, nDel = (j.deleted || []).length;
    var msg = hd + '일괄 ' + lbl + ' 적용 (' + nUpd + '건)' + (delZero ? ' · ' + nDel + '건 삭제' : cancelled ? ' · 0이하 삭제 취소' : '');
    var cap = (j.capped || []).concat(pre.cap);
    if (cap.length) msg += ' · ' + cap.length + '건은 추가 매수 한도까지만';
    var sk = (j.skipped || []).concat(pre.skip);
    if (sk.length) {
      msg += ' · ' + sk.length + '건 건너뜀\n\n건드리지 않은 주문:\n' + sk.map((function(s) {
        var nm = String(s.name || s.order_id || ''), rs = String(s.reason || '');
        if (nm && rs.indexOf(nm + ' — ') === 0) rs = rs.slice(nm.length + 3);
        return '· ' + nm + ' — ' + rs;
      })).join('\n');
    }
    say(msg, (function() {
      go(TAB);
    }));
  }
  obkPost(ids, delta, defBet, {
    preview: true
  }, pct).then((function(p) {
    if (!p.r.ok) return fail(p);
    var td = p.j.to_delete || [];
    if (!td.length) {
      return obkPost(ids, delta, defBet, {
        expect: expect,
        delete_zero: false,
        confirmed_delete_ids: []
      }, pct).then((function(x) {
        done(x, false, false);
      }));
    }
    var delSet = {};
    td.forEach((function(x) {
      delSet[String(x.order_id)] = 1;
    }));
    var keep = ids.filter((function(id) {
      return !delSet[String(id)];
    }));
    var rest = ids.filter((function(id) {
      return delSet[String(id)];
    }));
    var first = keep.length ? obkPost(keep, delta, defBet, {
      expect: expect,
      delete_zero: false
    }, pct) : Promise.resolve(null);
    return first.then((function(q) {
      if (q && !q.r.ok) return fail(q);
      if (q) {
        pre.upd = q.j.updated || [];
        pre.skip = q.j.skipped || [];
        pre.cap = q.j.capped || [];
      }
      BOT.busy = false;
      var names = td.map((function(x) {
        return x.name || x.order_id;
      })).join(', ');
      ask('다음 종목은 베팅액이 0 이하가 됩니다:\n' + names + '\n\n계속하면 삭제됩니다. (나머지 ' + pre.upd.length + '건은 이미 적용했습니다)\n' + '⚠ 확인 전까지 이 주문들은 원래 크기로 살아 있습니다.', (function() {}), true);
      var conf = td.map((function(x) {
        return String(x.order_id);
      }));
      DLG_CB = function(v) {
        BOT.busy = true;
        obkPost(rest, delta, defBet, {
          expect: expect,
          delete_zero: !!v,
          confirmed_delete_ids: v ? conf : []
        }, pct).then((function(x) {
          done(x, !!v, !v);
        })).catch((function(e) {
          BOT.busy = false;
          say(hd + '실패 — ' + e.message);
        }));
      };
    }));
  })).catch((function(e) {
    BOT.busy = false;
    dropCache();
    say(hd + '실패 — ' + e.message, (function() {
      go(TAB);
    }));
  }));
}

function sellRuleActions(r, kind, back) {

  }
  var me = function() {
    sellRuleActions(r, kind, back);
  };
  var flds = [ [ 'base_pct', '매입가 대비 %' ], [ 'qty_pct', '수량(%)' ] ];
  var items = flds.map((function(f) {
    return [ '✏️ ' + f[1] + ' 고치기', function() {
      if (f[0] === 'base_pct') {
        balPctEdit(r, me);
        return;
      }
      askVal('«' + r.label + '»\n' + f[1] + ' 새 값 (숫자만)', '', (function(v) {
        var body = {};
        body[f[0]] = v;
        botPost('/api/sell/rules/' + encodeURIComponent(r.rule_id), body, '고쳤습니다', 'PUT');
      }), true);
      dlgBackTo(me);
    } ];
  }));
  items.push([ '🗑 이 매도조건 삭제', function() {
    ask('«' + r.label + '» 규칙을 지웁니다.', (function() {
      botPost('/api/bot/delete', {
        kind: 'sellrule',
        value: r.rule_id
      });
    }), true);
    dlgBackTo(me);
  }, true ]);
  askPick('«' + r.label + '»', items);
  dlgBackTo(back);
}

function ruleTapSub(r) {
  if (r.app_edit === undefined || r.app_edit === null) return '누르면 봅니다 — 고치기는 컴퓨터 서버를 새로 켠 뒤에';
  if (r.app_edit && r.app_del) return '누르면 고치거나 지웁니다';
  if (r.app_edit) return '누르면 고칩니다';
  if (r.app_del) return '누르면 지울 수 있습니다(고치기는 앱에서 안 됨)';
  return '보기만 — 누르면 까닭' + (r.add_ok ? ' · ＋ 익절 조건 추가' : '');
}

    } ]);

function clockHMS(ms) {
  var t = new Date(Number(ms) || Date.now());
  return ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
}

function snWonOf(v) {
  var s = String(v).replace(/[\s,]/g, ''), mul = SN_AMT_UNIT.won;
  if (/만원?$/.test(s)) {
    s = s.replace(/만원?$/, '');
    mul = 1e4;
  } else if (/원$/.test(s)) {
    s = s.slice(0, -1);
    mul = 1;
  }
  if (!/^\d+$/.test(s)) {
    say('금액은 ' + SN_AMT_UNIT.label + ' 단위 정수로 적어 주세요 (소수점·글자는 안 됩니다 · 예: ' + snAmtEx() + ')');
    return null;
  }
  var n = parseInt(s, 10) * mul;
  if (!(n > 0)) {
    say('0 보다 큰 금액을 적어 주세요 (예: ' + snAmtEx() + ')');
    return null;
  }
  return n;
}

function snWonQty(won, px, held, pre) {
  var h = Math.floor(Number(held) || 0), p = Number(px);
  if (!(p > 0)) return {
    why: '팔지 않습니다 — 지금 값을 몰라 몇 주인지 셀 수 없습니다'
  };
  if (!(h > 0)) return {
    why: '팔지 않습니다 — 보유 수량이 없습니다'
  };
  var q = Math.floor(won / p), cut = false;
  if (q < 1) return {
    why: '팔지 않습니다 — ' + fmt(won) + '원으로는 1주도 안 됩니다 (' + (pre || '지금') + ' 1주 ' + fmt(p) + '원 · 주수는 내림)'
  };
  if (q > h) {
    q = h;
    cut = true;
  }
  return {
    qty: q,
    all: q >= h,
    cut: cut
  };
}

function snPctOf(v) {
  var s = String(v).replace(/[\s,%]/g, '');

function soDay(iso) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '다음 거래일';
  var dt = new Date(+m[1], +m[2] - 1, +m[3]);
  return +m[2] + '/' + m[3] + '(' + '일월화수목금토'[dt.getDay()] + ')';
}

function soWhen(iso) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return soDay(iso);
  var t = new Date;
  t.setHours(0, 0, 0, 0);
  var n = Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - t) / 864e5);
  return (n === 0 ? '오늘 ' : n === 1 ? '내일 ' : '') + soDay(iso);
}

  if (it && Number(it.amount) > 0) return fmt(Math.round(Number(it.amount) / 1e4)) + '만원어치';

  fetch(SO_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    return r.json().catch((function() {
      return null;
    })).then((function(j) {
      return {
        r: r,
        j: j || {}
      };
    }));
  })).then((function(x) {
    BOT.busy = false;

      return;

      return;

function sellNowSend(code, nm, pct, qty) {

  var body = qty ? {
    code: code,
    qty: qty
  } : {
    code: code,
    pct: pct
  };
  fetch('/api/bot/sell_now', {
    method: 'POST',

      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    return r.json().then((function(j) {
      return {
        r: r,
        j: j
      };
    }), (function() {
      return {
        r: r,
        j: null,
        bad: true
      };
    }));
  })).then((function(x) {
    BOT.busy = false;
    var r = x.r, j = x.j;
    if (r.ok && (x.bad || !j || typeof j !== 'object')) {
      snUnsure(nm, 'HTTP ' + r.status + ' · 답을 끝까지 못 읽었습니다');
      return;
    }
    if (r.status === 404) {
      say('팔지 않았습니다 — 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (HTTP 404)');
      return;
    }
    if (!r.ok || !j || !j.ok) {
      say('팔지 않았습니다 — ' + (j && (j.error || j.msg) || 'HTTP ' + r.status));
      return;
    }
    if (!j.req_id) {
      snUnsure(nm, '요청 번호가 답에 없습니다');
      return;
    }
    toast('📤 매도 요청을 보냈습니다 — 주문 프로그램이 곧 냅니다', 3e3, true);
    var t0 = Date.now();
    var seenFiring = false;
    (function poll() {
      cutGet('/api/bot/sell_now/' + encodeURIComponent(j.req_id), (function(r) {
        return r.json();
      })).then((function(s) {
        var st = s && s.status;

        if (st === 'done' || st === 'failed' || st === 'unknown' || st === 'expired') {
          dropCache();
          snResult((st === 'done' ? '✅ ' : st === 'unknown' ? '⚠ ' : '❌ ') + '«' + nm + '» ' + (s.message || st), st === 'done');
          return;
        }
        if (Date.now() - t0 > SN_WAIT_MS) {
          if (st === 'firing' || seenFiring) {
            dropCache();
            snResult('⚠ «' + nm + '» ' + SN_STUCK_MSG);
            return;
          }
          if (st === 'pending') {
            snResult('⚠ «' + nm + '» 결과를 아직 못 받았습니다 — 매매 알림을 확인해 주세요 (요청은 30초가 지나면 안 팔고 닫힙니다)');
            return;
          }
          snResult('⚠ «' + nm + '» 결과 모름 — 서버가 요청 상태를 못 읽었습니다(' + (s && (s.error || s.msg) || '상태 없음') + ')\n매매 알림과 증권사(HTS·MTS)에서 확인해 주세요');
          return;
        }
        setTimeout(poll, SN_POLL_MS);
      })).catch((function() {
        if (Date.now() - t0 > SN_WAIT_MS) {
          snResult('⚠ «' + nm + '» ' + (seenFiring ? SN_STUCK_MSG : '결과를 못 읽었습니다 — 매매 알림과 증권사(HTS·MTS)에서 확인해 주세요'));
          return;
        }
        setTimeout(poll, SN_POLL_MS);
      }));
    })();
  })).catch((function(e) {
    BOT.busy = false;
    snUnsure(nm, e && e.message || e);
  }));
}

function gsChips(p) {

    }));

    return S;
  }

    }));

function gsScope(S) {
  var p = S.p, its = p.items || [];
  var sel = its.filter((function(it) {
    return !!S.sel[it.code];
  }));
  if (S.locked) return {
    scope: 'locked',
    key: p.key,
    label: p.label,
    all: !!p.all,

    key: '',
    label: '',

    items: [],
    buys: null

    return c.key;
  }))).forEach((function(k) {

  for (var i = 0; i < order.length; i++) {

    body.textContent = '';
    if (S.miss && sc.scope === 'none') body.appendChild(el('div', 'gshd bad gsmiss', S.miss));
    if (cur.chips_error) body.appendChild(el('div', 'gshd bad', '🏷 ' + cur.chips_error));
    var list = el('div', 'gslist gsclist');
    (cur.items || []).forEach((function(it) {
      list.appendChild(gsCard(it, !!S.sel[it.code], S.locked ? null : function() {
        tap_(it.code);
      }));
    }));
    body.appendChild(list);
    var ex = gsExLine(cur), over = gsOver(cur, n);
    if (ex) body.appendChild(el('div', 'gshd gsex', ex));
    if (over) body.appendChild(el('div', 'gshd bad gsover', over));
    body.scrollTop = by;
    foot.className = 'gsfine' + (cur.open ? '' : ' bad');
    foot.textContent = cur.open ? GS_FOOT : '지금은 못 팝니다 — ' + (cur.why || '장 시간이 아닙니다');
    DLG_OK.style.display = cur.open && !over ? '' : 'none';
    DLG_OK.className = 'p gsok' + (st.ok && !st.load && n ? '' : ' gsoff') + (nSel ? '' : ' gsnone');
    DLG_OK.textContent = !nSel ? '고를 종목을 눌러 주세요' : (S.locked ? '' : '고른 ') + n + '종목 ' + (pct >= 100 ? '전량' : pct + '%') + ' 매도';
  }
  function ask_(n, then) {
    var my_rq = ++rq;
    cutGet(gsPrevUrl(S.entry) + (S.locked ? '' : '&pick=1') + '&pct=' + n, (function(r) {
      return r.json();
    })).then((function(q) {
      if (my_rq !== rq || !(then || alive())) return;
      if (then && DLG.classList.contains('on')) return;
      if (!q || q.ok === false || !q.pct_ok || Number(q.pct) !== n || !(q.items || []).length || !S.locked && q.pick_ok !== true) {
        st = {
          ok: false,
          why: '몇 주인지 못 셌습니다 — ' + (q && q.error || '답이 비었습니다')
        };
        if (then) {
          gsPick(S, String(n));
          return;
        }
        paint();
        return;
      }
      S.p = cur = q;
      st = {
        ok: true,
        n: n,
        load: false
      };
      if (then) {
        then(cur);
        return;
      }
      setTitle();
      paint();
    })).catch((function(e) {
      if (my_rq !== rq || !(then || alive())) return;
      if (then && DLG.classList.contains('on')) return;
      st = {
        ok: false,
        why: '몇 주인지 못 셌습니다 — ' + (e && e.message || e)
      };
      if (then) {
        gsPick(S, String(n));
        return;
      }
      paint();
    }));
  }
  function check() {
    clearTimeout(timer);
    if (!cur.pct_ok) return;
    var r = gsPctOf(inp.value);
    if (r.why) {
      rq++;
      st = {
        ok: false,
        why: r.why
      };
      paint();
      return;
    }
    if (r.n === gsPctIs(cur)) {
      rq++;
      st = {
        ok: true,
        n: r.n,
        load: false
      };
      paint();
      return;
    }
    st = {
      ok: true,
      n: r.n,
      load: true
    };
    paint();
    timer = setTimeout((function() {
      ask_(r.n);
    }), 300);
  }
  if (!cur.pct_ok) {
    inp.value = '100';
    inp.disabled = true;
  }
  inp.addEventListener('input', check);
  if (cur.pct_ok) check(); else paint();
  DLG_CB = function(v) {
    if (!v) return;
    clearTimeout(timer);
    var r = cur.pct_ok ? gsPctOf(inp.value) : {
      n: 100
    };
    var nn = gsSendItems(gsScope(S)).length;
    if (r.why || gsOver(cur, nn)) {
      gsPick(S, inp.value);
      return;
    }
    if (r.n !== gsPctIs(cur)) {
      toast('몇 주인지 세는 중…', 1500);
      ask_(r.n, (function() {
        gsConfirm(S);
      }));
      return;
    }
    if (!nn) {
      gsPick(S, inp.value);
      return;
    }
    gsConfirm(S);
  };
}

function gsConfirm(S) {
  var p = S.p, pct = gsPctIs(p), sc = gsScope(S), bn = gsBuysNote(sc, pct, p, S);
  var sel = gsSendItems(sc), skip = sc.items.filter((function(it) {
    return !(gsSq(it) > 0);
  }));
  if (!sel.length || gsOver(p, sel.length)) {
    gsPick(S);
    return;
  }
  var lines = sel.map((function(it) {
    return '· ' + (it.name || it.code) + ' ' + (pct >= 100 ? fmt(it.qty) + '주' : fmt(it.qty) + '주 중 ' + fmt(gsSq(it)) + '주');
  })).join('\n');
  if (skip.length) lines += '\n' + skip.map((function(it) {
    return '· ' + (it.name || it.code) + ' 0주 — 안 팖';
  })).join('\n');
  var nm = gsNameN(sc, sel.length);
  var msg = (pct >= 100 ? nm + ' 전량을 지금 시장가로 팝니다.\n(종목마다 신용분부터 · 한 종목씩 차례로)\n\n' : nm + ' 보유의 ' + pct + '%를 지금 시장가로 팝니다.\n' + '(종목마다 신용분부터 · 한 종목씩 차례로 · 주수는 파는 순간 보유로 다시 셉니다)\n\n') + lines + '\n\n시장가라 바로 체결되고 되돌릴 수 없습니다.\n화면을 닫아도 컴퓨터가 끝까지 팝니다.';
  if (gsExLine(p) && (sc.scope === 'all' || sc.scope === 'locked')) msg += '\n\n' + gsExLine(p);
  if (bn) msg += '\n\n' + bn + '.';
  ask(msg, (function() {
    gsSend(S, sc);
  }));
  dlgBackTo((function() {
    gsPick(S);
  }));
}

function gsExLine(p) {
  var ex = p && p.excluded || [];
  if (!ex.length) return '';
  return '제외: ' + ex.map((function(x) {
    return (x.name || x.code) + '(' + (x.why || '시세 없음') + ')';
  })).join(', ');
}

function gsOver(p, n) {
  var mx = Number(p && p.max_items);
  if (!(mx > 0) || !(n > mx)) return '';
  return '⛔ 팔 종목이 ' + n + '개라 한 번에 팔 수 있는 ' + mx + '종목을 넘습니다 — 아무것도 보내지 않습니다\n' + '칩으로 나눠 팔거나 종목마다 «바로 매도» 로 팔아 주세요';
}

function gsSend(S, sc) {
  if (BOT.busy) return;
  BOT.busy = true;
  var p = S.p, none = '팔지 않았습니다';
  var send = gsSendItems(sc);
  var body = {
    key: sc.key,
    mode: 'now',
    items: send.map((function(it) {
      return {
        code: it.code,
        name: it.name,
        qty: gsSq(it)
      };
    }))
  };
  if (p.pct_ok) body.pct = gsPctIs(p);
  if (sc.buys && Array.isArray(sc.buys.ids)) body.buy_ids = sc.buys.ids;
  var bp = {
    key: sc.key,
    label: sc.label,
    all: !!sc.all,
    scope: sc.scope,
    items: send,
    pct: p.pct,
    pct_ok: p.pct_ok
  };
  fetch(GS_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    return r.json().then((function(j) {
      return {
        r: r,
        j: j || {}
      };
    }), (function() {
      return {
        r: r,
        j: {},
        bad: true
      };
    }));
  })).then((function(x) {
    BOT.busy = false;
    var r = x.r, j = x.j;
    if (x.bad && r.ok) {
      gsUnsure('HTTP ' + r.status + ' · 답을 끝까지 못 읽었습니다');
      return;
    }
    if (r.status === 404 && !j.error) {
      say(none + ' — 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (HTTP 404)');
      return;
    }
    if (!r.ok || !j.ok) {
      say(none + ' — ' + (j.error || j.msg || 'HTTP ' + r.status));
      return;
    }
    dropCache();
    gsBoard(j.batch_id, bp, j);
  })).catch((function(e) {
    BOT.busy = false;
    gsUnsure(e && e.message || e);
  }));
}

function gsUnsure(why) {
  say('⚠ 답을 못 받았습니다 (' + why + ')\n보내졌을 수 있습니다 — 매매 알림과 [잔고] 를 확인해 주세요');
}

function gsBoardRow(it) {
  var st = it.status, q = it.qty || it.snap_qty, b, sub, bad = false;
  if (st === 'queued') {
    b = [ '', '⌛ 대기' ];
    sub = fmt(it.snap_qty) + '주 · 차례 기다림';
  } else if (st === 'pending' || st === 'firing') {
    b = [ 'go', '⏳ 보내는 중' ];
    sub = fmt(it.snap_qty) + '주 · 결과 기다리는 중';
  } else if (st === 'done') {
    b = [ 'ok', '✅ 접수' ];
    sub = fmt(q) + '주 시장가 매도 접수';
  } else if (st === 'unknown') {
    b = [ 'unk', '⚠ 모름' ];
    sub = it.message || '접수 여부를 모릅니다';
    bad = true;
  } else {
    b = [ 'bad', '❌ 실패' ];
    sub = it.message || st;
    bad = true;
  }
  var r = el('div', 'gsit'), l = el('span', 'gl');
  r.setAttribute('data-st', st || '');
  l.appendChild(el('span', 'gn', it.name || it.code));
  l.appendChild(el('span', 'gs' + (bad ? ' bad' : ''), sub));
  r.appendChild(l);
  r.appendChild(el('span', 'gsbadge ' + b[0], b[1]));
  return r;
}

function gsBuysLine(buys, p) {
  if (!buys) return null;
  if (buys.error) return el('div', 'gshd bad', '🗑 ' + buys.error);
  var t = buys.deleted ? (p && p.all ? '🗑 걸려 있던 대기 매수 ' : p && p.scope === 'pick' ? '🗑 고른 종목에 걸려 있던 대기 매수 ' : '🗑 이 칩의 대기 매수 ') + buys.deleted + '건도 지웠습니다' : '';
  if (buys.failed && buys.failed.length) t += (t ? ' · ' : '🗑 ') + '못 지운 것 ' + buys.failed.length + '건(발사 중이거나 이미 없음)';
  return t ? el('div', 'gshd', t) : null;
}

function gsBoard(bid, p, first) {
  var my = ++GS_SEQ, t0 = Date.now(), fin = false;
  askPick('', []);
  function alive() {
    var w = DLG_PICK.firstChild;
    return my === GS_SEQ && DLG.classList.contains('on') && DLG_PICK.style.display !== 'none' && w && w.getAttribute && w.getAttribute('data-gs') === String(my);
  }
  function draw(s, late) {
    var its = s && s.items || p.items.filter((function(it) {
      return gsSq(it) > 0;
    })).map((function(it) {
      return {
        code: it.code,
        name: it.name,
        snap_qty: gsSq(it),
        status: 'queued'
      };
    }));
    var c = s && s.counts || {
      done: 0,
      failed: 0,
      unknown: 0,
      left: its.length
    };
    var n = its.length;
    var pct = s && s.pct >= 1 && s.pct <= 100 ? Number(s.pct) : first && first.pct >= 1 ? Number(first.pct) : gsPctIs(p);
    fin = !!(s && s.status === 'done');
    DLG_MSG.textContent = fin ? gsNameN(p, n) + ' 중 ' + c.done + '종목 팔았습니다' + (pct < 100 ? ' (보유 ' + pct + '%)' : '') : '📤 ' + gsName(p) + ' ' + (pct < 100 ? '보유 ' + pct + '% ' : '') + '파는 중 — ' + (n - c.left) + '/' + n;
    var w = el('div', 'gswrap');
    w.setAttribute('data-gs', String(my));
    var parts = [ gsHow(pct), '✅ 접수 ' + c.done ];
    if (c.failed) parts.push('❌ 실패 ' + c.failed);
    if (c.unknown) parts.push('⚠ 모름 ' + c.unknown);
    if (!fin) parts.push('남은 ' + c.left + '종목');
    w.appendChild(el('div', 'gshd', parts.join(' · ')));
    if (fin) {
      var badN = its.filter((function(x) {
        return x.status !== 'done' && x.status !== 'unknown';
      }));
      var unkN = its.filter((function(x) {
        return x.status === 'unknown';
      }));
      if (badN.length) w.appendChild(el('div', 'gshd bad', '❌ ' + badN.length + '종목 못 팔았습니다 — ' + badN.map((function(x) {
        return x.name || x.code;
      })).join(', ')));
      if (unkN.length) w.appendChild(el('div', 'gshd bad', '⚠ ' + unkN.length + '종목은 접수 여부를 모릅니다 — 증권사에서 확인해 주세요'));
    } else {
      var bar = el('div', 'gsbar'), fill = el('i');
      fill.style.width = Math.round((n - c.left) * 100 / Math.max(1, n)) + '%';
      bar.appendChild(fill);
      w.appendChild(bar);
    }
    var bl = gsBuysLine(first && first.buys || null, p);
    if (bl) w.appendChild(bl);
    if (late) w.appendChild(el('div', 'gshd', '⚠ 결과를 아직 다 못 받았습니다 — 컴퓨터는 계속 팝니다 · 매매 알림을 확인해 주세요'));
    var list = el('div', 'gslist');
    its.forEach((function(it) {
      list.appendChild(gsBoardRow(it));
    }));
    w.appendChild(list);
    DLG_PICK.textContent = '';
    DLG_PICK.appendChild(w);
    if (fin) {
      DLG_NO.style.display = 'none';
      DLG_OK.style.display = '';
      DLG_OK.className = 'p gsok';
      DLG_OK.textContent = '확인';
    } else {
      DLG_NO.style.display = '';
      DLG_NO.textContent = '닫기';
      DLG_OK.style.display = 'none';
    }
  }
  draw(null);
  DLG_CB = function() {
    GS_SEQ++;
    DLG_NO.style.display = '';
    if (!fin) toast('📤 컴퓨터가 끝까지 팝니다 — 결과는 매매 알림으로 옵니다', 3500, true);
    go(TAB);
  };
  (function poll() {
    if (!alive()) return;
    cutGet(GS_URL + '/' + encodeURIComponent(bid), (function(r) {
      return r.json();
    })).then((function(s) {
      if (!alive()) return;
      if (s && s.ok !== false) draw(s);
      if (fin) return;
      if (Date.now() - t0 > GS_WAIT_MS) {
        draw(s && s.ok !== false ? s : null, true);
        return;
      }
      setTimeout(poll, GS_POLL_MS);
    })).catch((function() {
      if (alive()) setTimeout(poll, GS_POLL_MS * 2);
    }));
  })();
}

function beItem(cd, code, nm, back) {
  if (!cd || cd.ok === false) {
    var why = cd && cd.error || '답이 비었습니다';
    return [ '🛡 본전 상향', function() {
      beAsk(null, code, nm, why, undefined, back);
    }, false, {
      id: 'pk-be',
      sub: '가능한지 못 읽었습니다 (' + why + ') — 눌러도 컴퓨터가 그 자리에서 다시 확인합니다'
    } ];
  }
  var it = (cd.items || []).filter((function(x) {
    return String(x.code) === code;
  }))[0];
  if (!it) return [ '🛡 본전 상향 불가', null, false, {
    off: true,
    id: 'pk-be',
    sub: '지금 컴퓨터가 읽은 보유 목록에 이 종목이 없습니다'
  } ];
  if (!it.eligible) return [ '🛡 본전 상향 불가', null, false, {
    off: true,
    id: 'pk-be',
    sub: it.reason || '지금은 올릴 수 없습니다'
  } ];
  var tk = cd.ticks != null ? cd.ticks : '?';
  var _bn = it.be_note || '매수가 +' + tk + '틱';
  return [ '🛡 본전 상향', function() {
    beAsk(it, code, nm, '', tk, back);
  }, false, {
    id: 'pk-be',
    sub: '손절을 ' + fmt(it.breakeven) + '원(' + _bn + ')으로 올립니다'
  } ];
}

function beAsk(it, code, nm, why, tk, back) {
  var msg = '«' + nm + '» 손절을 본전으로 올립니다.\n\n';
  if (it) {
    var pl = Number(it.pl_rate || 0);
    msg += '· 새 손절 ' + fmt(it.breakeven) + '원 (매수가 ' + fmt(it.avg) + '원 · ' + (it.be_note ? it.be_note.replace(/^매수가 /, '') : '+' + tk + '틱') + ')\n' + '· 지금 ' + fmt(it.cur) + '원 · 수익률 ' + (pl >= 0 ? '+' : '') + pl.toFixed(2) + '%\n\n' + '새 손절 이하로 걸린 손절은 이 하나(남은 수량 전부)로 바뀝니다.\n' + '새 손절보다 높게 걸린 손절·트레일링 선과 익절은 그대로 둡니다.\n' + '값이 새 손절까지 내려오면 남은 수량 전부를 시장가로 팝니다.' + (it.reason ? '\n\n※ ' + it.reason : '');
  } else {
    msg += '가능한지 미리 못 읽었습니다 (' + why + ').\n' + '누르면 컴퓨터가 그 자리에서 다시 확인하고, 안 되면 까닭을 알려 드립니다.';
  }
  ask(msg, (function() {
    botPost('/api/bot/breakeven', {
      action: 'raise',
      codes: [ code ]
    });
  }));
  dlgBackTo(back);
}

function bulkMenuRow(bal) {
  gaProbe();
  var r = el('div', 'row');
  var b = el('button', 'btn', '📋 일괄');
  b.id = 'bulk-menu';
  b.onclick = function() {
    bulkMenu(bal);
  };
  r.appendChild(b);
  return r;
}

function bulkMenu(bal) {
  var items = [];
  var ga = gaItem(bal, (function() {
    bulkMenu(bal);
  }));
  if (ga) items.push(ga);
  if (!items.length) {
    say(bulkNone(bal));
    return;
  }
  askPick('일괄', items);
}

function bulkNone(bal) {
  var c = GS_CAP[GS_ALL_KEY];
  if (!c) return '일괄 작업을 확인하는 중입니다 — 잠시 뒤 다시 눌러 주세요.';
  if (c.err) gsProbe(GS_ALL_KEY);
  var why = c.err ? '컴퓨터 서버에 묻지 못했습니다 — 잠시 뒤 다시 눌러 주세요' : c.old ? '컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다' : c.why ? c.why : c.ok && !gaCount(bal || {}) ? '시세 있는 보유 종목이 없습니다' : '';
  return '지금 할 수 있는 일괄 작업이 없습니다.' + (why ? '\n\n«보유 전체 매도» — ' + why : '');
}

var BAL_REFRESHING = false;

function balRefresh(quiet) {
  if (BAL_REFRESHING) return;
  BAL_REFRESHING = true;
  var btn = document.getElementById('hd-refresh');
  if (btn) btn.classList.add('busy');
  return cutGet('/api/balance?refresh=1', (function(r) {
    return r.json().catch((function() {
      return null;
    })).then((function(j) {
      if (!r.ok) throw new Error(j && j.error || 'HTTP ' + r.status);
      if (!j || typeof j !== 'object') throw new Error('답을 읽지 못했습니다');
      return j;
    }));
  })).then((function(d) {
    var cm = d.cache_meta;
    if (cm) {
      sayNoCover('증권사에서 새로 받지 못했습니다.\n' + String(cm.reason || '').replace(/\s*—\s*캐시 표시$/, '') + '\n\n마지막으로 받아 둔 잔고는 ' + (cm.mtime || '?') + (cm.age ? ' (' + cm.age + ')' : '') + ' 것입니다.');
      return;
    }
    var now = Date.now();
    JC['/api/balance'] = {
      ts: now,
      data: d,
      busy: false,
      forcedAt: now
    };
    live(true);
    if (TAB === 'balance') renderBalance();
    fetch(RISK_URL + '?fresh=1', {
      headers: {
        Accept: 'application/json'
      },
      cache: 'no-store'
    }).then((function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })).then((function(j) {
      if (!j || j.ok === false) return;
      JC[RISK_URL] = {
        ts: Date.now(),
        data: j,
        busy: false,
        forcedAt: Date.now()

function fxShrink(file) {
  return new Promise((function(res) {
    if (!file || file.size < 15e5 || !window.URL || !document.createElement('canvas').toBlob) {
      res(file);
      return;
    }
    var u = URL.createObjectURL(file), im = new Image;
    im.onload = function() {
      try {
        var W = im.naturalWidth, H = im.naturalHeight, s = Math.min(1, 1600 / Math.max(W, H));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(W * s));
        cv.height = Math.max(1, Math.round(H * s));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob((function(b) {
          URL.revokeObjectURL(u);
          res(b && b.size ? b : file);
        }), 'image/jpeg', .85);
      } catch (e) {
        URL.revokeObjectURL(u);
        res(file);
      }
    };
    im.onerror = function() {
      URL.revokeObjectURL(u);
      res(file);
    };
    im.src = u;
  }));
}

function pvBusy() {
  if (document.hidden) return '화면 꺼짐';
  if (DLG.classList.contains('on')) return '물어보는 창';
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable)) return '입력 중';
  if (BOT.page || BOT.open) return '하위 화면';
  if (BAL_REFRESHING) return '잔고 받는 중';
  if (AM.open) return '전체 메뉴';
  if (TAB === 'fixnotes' && (FX.dirty || FX.busy)) return '수정사항 작성 중';
  for (var _ak in AR_PEND) if (AR_PEND[_ak]) return '기본 매도 규칙 저장 중';
  if (Date.now() - PV.touchAt < 1500) return '손가락';
  return '';
}

function pvCheck() {
  if (!pvOn()) return;
  if (Date.now() - PV.askedAt < 5e3) return;
  PV.askedAt = Date.now();
  fetch('/api/page_version?page=mobile', {
    cache: 'no-store'
  }).then((function(r) {
    return r.ok ? r.json() : null;
  })).then((function(d) {
    var v = d && d.v;
    if (!v) return;
    if (PV.base == null) {
      PV.base = v;
      return;
    }
    if (v === PV.base || pvBusy()) return;
    pvReload();
  })).catch((function() {}));
}

function pvReload() {
  var h = '#m=' + TAB;
  if (TAB === 'chart' && CH.code) h += '&code=' + CH.code + '&name=' + encodeURIComponent(CH.name || '') + (CH.from ? '&from=' + CH.from : '');
  try {
    sessionStorage.setItem('m_pv_reloaded', String(Date.now()));
  } catch (e) {}
  try {
    history.replaceState(null, '', location.pathname + location.search + h);
  } catch (e) {
    location.hash = h;
  }
  location.reload();
}

document.addEventListener('touchstart', (function() {
  PV.touchAt = Date.now();
}), {
  passive: true,
  capture: true
});

document.addEventListener('touchend', (function() {
  PV.touchAt = Date.now();
}), {
  passive: true,
  capture: true
});

(function() {
  var t = 0;
  try {
    t = +(sessionStorage.getItem('m_pv_reloaded') || 0);
    sessionStorage.removeItem('m_pv_reloaded');
  } catch (e) {}
  if (t && Date.now() - t < 1e4) toast('🔄 새 판으로 바꿨습니다');
})();

pvCheck();

setInterval(pvCheck, 3e4);

document.addEventListener('visibilitychange', (function() {
  if (document.hidden) return;
  pvCheck();
  checkUnread();
  loadDots();
  if (TAB === 'balance') renderBalance(); else if (TAB === 'orders') renderOrders(); else if (TAB === 'today') renderToday(); else if (TAB === 'chart') chLiveLoop();
  tdBadgeTick();
  warmRun();
}));
</script>
