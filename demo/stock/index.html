<script>
'use strict';

var MK_URL = '/api/bot/market_overview';

var MK = {
  chip: 'top',
  sel: null,
  seq: 0
};

function mkPct(v) {
  return v == null || !isFinite(Number(v)) ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%';
}

function mkCls(v) {
  return v == null ? 'mut' : v > 0 ? 'up' : v < 0 ? 'dn' : '';
}

function mkNum(v) {
  return v == null || !isFinite(Number(v)) ? '—' : Number(v).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function mkMd(ymd) {
  var s = String(ymd || '').replace(/-/g, '');
  return s.length >= 8 ? +s.slice(4, 6) + '/' + +s.slice(6, 8) : s;
}

function mkWhy(d) {
  var why = d.__err ? d.__err.message || String(d.__err) : d.error || '답이 비었습니다';
  return /HTTP 404/.test(why) ? '컴퓨터 서버를 다시 켠 뒤에 나옵니다 (HTTP 404)' : why;
}

function mkMiss(lm, dim) {
  return !!(lm && lm[dim]);
}

function mkHm(s) {

<script>
'use strict';

var TD_URL = '/api/bot/today_trades';

var TD = {
  good: null
};

function tdNum(v) {
  return v == null || !isFinite(Number(v)) ? null : Number(v);
}

function tdWon(v) {
  var n = tdNum(v);
  return n === null ? '—' : Math.round(n).toLocaleString() + '원';
}

function tdSigned(v) {
  var n = tdNum(v);
  return n === null ? '—' : (n > 0 ? '+' : '') + Math.round(n).toLocaleString() + '원';
}

function tdCls(v) {
  var n = tdNum(v);
  return n === null ? 'mut' : n > 0 ? 'up' : n < 0 ? 'dn' : '';
}

function tdPrice(v) {
  var n = tdNum(v);
  return n === null ? '—' : n.toLocaleString('en-US', {
    maximumFractionDigits: 2
  });
}

function tdTm(t) {
  var s = String(t || '').trim();
  if (/^\d{6}$/.test(s)) return s.slice(0, 2) + ':' + s.slice(2, 4) + ':' + s.slice(4, 6);
  return s || '—';
}

function tdToday() {
  var d = new Date;
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function tdWhy(d) {
  if (d.__err) {
    var m = d.__err.message || String(d.__err);
    return '오늘 체결을 못 읽었습니다 — ' + (/HTTP 404/.test(m) ? '컴퓨터 서버를 다시 켠 뒤에 나옵니다 (HTTP 404)' : m);
  }
  return d.error || '오늘 체결을 못 읽었습니다 — 답이 비었습니다';
}

function tdSumBox(d) {
  var s = d.sums || {}, rz = d.realized, box = el('div', 'td-sum');
  function row(name, sub, val, cls, big) {
    var r = el('div', 'r' + (big ? ' big' : '')), n = el('span', 'n', name);
    if (sub) n.appendChild(el('small', '', sub));
    r.appendChild(n);
    r.appendChild(el('span', 'v' + (cls ? ' ' + cls : ''), val));
    box.appendChild(r);
    return r;
  }
  row('매수 합', (s.n_buy || 0) + '건', tdWon(s.buy || 0)).setAttribute('data-tdsum', 'buy');
  row('매도 합', (s.n_sell || 0) + '건', tdWon(s.sell || 0)).setAttribute('data-tdsum', 'sell');
  if (rz && rz.ok && rz.sold === false) {
    row('실현손익', '', '판 것 없음', 'mut', true).setAttribute('data-tdsum', 'realized');
    var bc = Math.abs(Number(rz.cmsn || 0));
    if (bc) {
      var bcl = el('div', 'psum', '매수 수수료 −' + fmt(bc) + '원');
      bcl.setAttribute('data-tdsum', 'buycmsn');
      box.appendChild(bcl);
    }
  } else if (rz && rz.ok) {
    row('실현손익', '', tdSigned(rz.net), tdCls(rz.net), true).setAttribute('data-tdsum', 'realized');
  } else {
    row('실현손익', '', '못 읽음', 'mut', true).setAttribute('data-tdsum', 'realized');
    box.appendChild(el('div', 'w', rz && rz.error || '실현손익을 못 읽었습니다'));
  }
  var ps = tdPnlSumLine(d.pnl_sum, rz && rz.ok);
  if (ps) box.appendChild(ps);
  var qon = el('div', 'qon');
  qon.id = 'td-q-on';
  qon.style.display = 'none';
  box.appendChild(qon);
  return box;
}

var TD_PSUM_HOW = '맨 위 실현손익은 증권사 «일자별 실현손익» 값입니다([잔고] 오늘 실현손익과 같은 값). ' + '종목 줄 손익은 증권사 «당일매매일지» 값이고, 종목 합은 그 합입니다. ' + '증권사의 두 조회가 수수료·세금과 매입 원가를 서로 다르게 잡아 합이 다를 수 있습니다(매도금액은 같음). ' + '차이 = 종목 합 − 실현손익.';

function tdPnlSumLine(ps, rzOk) {
  if (!ps || tdNum(ps.amount) === null) return null;
  var diff = tdNum(ps.diff), est = !!ps.est, parts;
  if (rzOk && diff === 0) parts = [ '종목 합과 같음' + (est ? ' · 어림' : '') ]; else {
    parts = [ '종목 합 ' + tdSigned(ps.amount) + (est ? ' 어림' : '') ];
    if (rzOk && diff !== null) parts.push('차이 ' + tdSigned(diff));
  }
  var full = TD_PSUM_HOW + (est ? ' «어림» = 일지에 아직 안 담긴 종목이 있어 그 종목은 리포트 셈으로 어림한 값이 섞였습니다.' : '');
  var ln = el('div', 'psum');
  parts.forEach((function(p, i) {
    if (i) ln.appendChild(document.createTextNode(' · '));
    var sp = el('span', 'nw', p);

function scrKey() {
  try {
    return [ TAB, BOT.pick, BOT.page, MK.sel ? MK.sel.dim + '|' + MK.sel.name : '', TAB === 'chart' ? CH.code || '' : '' ].join('');
  } catch (e) {
    return String(TAB);
  }
}

function dlgRun(fn, v) {
  var was = DLG_RUN;
  DLG_RUN = scrKey();
  try {
    fn(v);
  } finally {
    DLG_RUN = was;
  }
}

var KEEP = null, KEEP_MO = null;

function keepScroll(top, inner) {
  var _hasIn = !!inner && Object.keys(inner).some((function(k) {
    return inner[k].l > 0 || inner[k].t > 0;
  }));
  KEEP = top > 0 || _hasIn ? {
    top: top,
    inner: _hasIn ? inner : null,
    key: scrKey(),
    until: Date.now() + 15e3
  } : null;
  if (KEEP && !KEEP_MO && window.MutationObserver) {
    KEEP_MO = new MutationObserver(keepApply);
    KEEP_MO.observe(BD, {
      childList: true,
      subtree: true,
      characterData: true
    });
  }
}

function keepApply() {
  if (KEEP && (Date.now() > KEEP.until || scrKey() !== KEEP.key)) KEEP = null;
  if (!KEEP) {
    if (KEEP_MO) {
      KEEP_MO.disconnect();
      KEEP_MO = null;
    }
    return;
  }
  if (BD.scrollTop !== KEEP.top) BD.scrollTop = KEEP.top;
  if (KEEP.inner) navInnerApply(KEEP.inner);
}

[ 'touchstart', 'wheel', 'mousedown', 'keydown' ].forEach((function(ev) {
  document.addEventListener(ev, (function() {
    KEEP = null;
  }), {
    passive: true,
    capture: true
  });
}));

var NAV = {
  key: null,
  top: 0,
  inner: {},
  mem: {},
  back: false
};

function navInnerId(e) {
  var cls = e.className;
  if (typeof cls !== 'string') return null;
  var all = BD.getElementsByTagName(e.tagName), n = 0;
  for (var i = 0; i < all.length; i++) {
    if (all[i] === e) return e.tagName + '.' + cls + '#' + n;
    if (all[i].className === cls) n++;
  }
  return null;
}

function navInnerFind(id) {
  var a = id.indexOf('.'), b = id.lastIndexOf('#');
  if (a < 0 || b < a) return null;
  var tag = id.slice(0, a), cls = id.slice(a + 1, b), want = +id.slice(b + 1), n = 0;
  var all = BD.getElementsByTagName(tag);
  for (var i = 0; i < all.length; i++) {
    if (all[i].className !== cls) continue;
    if (n === want) return all[i];
    n++;
  }
  return null;
}

function navInnerApply(inner) {
  Object.keys(inner || {}).forEach((function(id) {
    var e = navInnerFind(id), v = inner[id];
    if (!e) return;
    if (e.scrollLeft !== v.l) e.scrollLeft = v.l;
    if (e.scrollTop !== v.t) e.scrollTop = v.t;
  }));
}

function navSync(full) {
  var k = scrKey();
  if (k !== NAV.key) {
    if (NAV.key !== null) NAV.mem[NAV.key] = {
      top: NAV.top,
      inner: NAV.inner
    };
    NAV.key = k;
    NAV.top = BD.scrollTop;
    NAV.inner = {};
    return;
  }
  NAV.top = BD.scrollTop;
  if (full) Object.keys(NAV.inner).forEach((function(id) {
    var e = navInnerFind(id);
    if (e) NAV.inner[id] = {
      l: e.scrollLeft,
      t: e.scrollTop
    };
  }));
}

BD.addEventListener('scroll', (function() {
  navSync(false);
}), {
  passive: true
});

document.addEventListener('scroll', (function(ev) {
  var e = ev.target;
  if (!e || e === BD || e === document || !e.nodeType || !BD.contains(e)) return;
  navSync(false);
  var id = navInnerId(e);
  if (id) NAV.inner[id] = {
    l: e.scrollLeft,
    t: e.scrollTop
  };
}), {
  passive: true,
  capture: true
});

[ 'touchstart', 'mousedown', 'click' ].forEach((function(ev) {
  document.addEventListener(ev, (function() {
    navSync(true);
  }), {
    passive: true,
    capture: true
  });
}));

function navBack(fn) {
  if (NAV.back) return fn();
  navSync(true);
  var k0 = NAV.key, r;
  NAV.back = true;
  try {
    r = fn();
  } finally {
    NAV.back = false;
  }
  var k1 = scrKey();
  if (k1 !== k0) {
    navSync(false);
    var m = NAV.mem[k1];
    if (m) {
      if (m.top > 0) BD.scrollTop = m.top;
      navInnerApply(m.inner);
      var _in = {};
      Object.keys(m.inner || {}).forEach((function(id) {
        _in[id] = m.inner[id];
      }));
      NAV.top = BD.scrollTop;
      NAV.inner = _in;
      keepScroll(m.top, m.inner);
    }
  }
  return r;
}

function pickRow(it) {
  var txt = String(it[0]), ic = '', op = it[3] || {};
  var m = txt.match(/^(\S+)\s+([\s\S]+)$/);
  if (m && /[^\w가-힣]/.test(m[1])) {
    ic = m[1];
    txt = m[2];
  }
  var cls = [];
  if (it[2]) cls.push('r');
  if (op.off) cls.push('off');
  var b = el('button', cls.join(' '));
  if (op.id) b.id = op.id;
  b.appendChild(el('span', 'ic', ic || '•'));
  var _pt = el('span', '', txt);
  sellKindPaint(_pt);
  if (op.sub != null) {
    var tx = el('span', 'tx');
    tx.appendChild(_pt);
    tx.appendChild(el('span', 'sub', op.sub));
    b.appendChild(tx);
  } else {
    b.appendChild(_pt);
  }
  if (op.off) {
    b.disabled = true;
    return b;
  }
  b.appendChild(el('span', 'go', '›'));
  b.onclick = function() {
    DLG_PICK.style.display = 'none';
    DLG_OK.style.display = '';
    DLG.classList.remove('on', 'sheet');
    dlgRun((function() {
      it[1]();
    }));
  };
  return b;
}

}

var _masking = false;

var MONEY_RE = /[+\-−]?\s?[\d][\d,]*(\.\d+)?\s?(만원|억원|원)/g;

var CODE_RE = /\s*\((\d{6})\)/g;

function stripCodes(root) {
  if (!root) return;
  try {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var ns = [], n;
    while (n = w.nextNode()) ns.push(n);
    ns.forEach((function(t) {
      CODE_RE.lastIndex = 0;
      if (CODE_RE.test(t.nodeValue)) {
        CODE_RE.lastIndex = 0;
        t.nodeValue = t.nodeValue.replace(CODE_RE, '');
      }
      CODE_RE.lastIndex = 0;
    }));
  } catch (e) {}
}

function maskMoney(root) {
  if (!HIDE_MONEY || _masking || !root) return;
  _masking = true;
  try {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var ns = [], n;
    while (n = w.nextNode()) ns.push(n);
    ns.forEach((function(t) {
      if (MONEY_RE.test(t.nodeValue)) {
        MONEY_RE.lastIndex = 0;
        t.nodeValue = t.nodeValue.replace(MONEY_RE, (function(m) {
          return (/^\s/.test(m) ? m.charAt(0) : '') + '•••' + (m.indexOf('만원') >= 0 ? '만원' : m.indexOf('억원') >= 0 ? '억원' : '원');
        }));
      }
      MONEY_RE.lastIndex = 0;
    }));
  } catch (e) {}
  _masking = false;
}

var _lastSig = '';

var _lastKids = [];

function _bdUntouched() {
  var k = BD.childNodes;
  if (!k.length || k.length !== _lastKids.length) return false;
  for (var i = 0; i < k.length; i++) if (k[i] !== _lastKids[i]) return false;
  return true;
}

var _fpN = 0;

function fpOf(x) {
  try {
    var s = JSON.stringify(x);
    if (typeof s === 'string') return s;
  } catch (e) {}
  return '' + ++_fpN;
}

function swapBody(frag) {
  var _cls = [];
  try {
    var _ce = frag.querySelectorAll ? frag.querySelectorAll('[class]') : [];
    for (var _i = 0; _i < _ce.length; _i++) _cls.push(_ce[_i].className);
  } catch (e) {}
  var _fp = [];
  try {
    var _fe = frag.querySelectorAll ? frag.querySelectorAll('[data-fp]') : [];
    for (var _j = 0; _j < _fe.length; _j++) _fp.push(_fe[_j].getAttribute('data-fp'));
  } catch (e) {}
  var sig = TAB + '\0' + (frag.textContent || '') + '\0' + _cls.join(',') + '\0' + _fp.join('');
  if (sig === _lastSig && _bdUntouched()) return;
  _lastSig = sig;
  navSync(true);
  var top = BD.scrollTop;
  BD.textContent = '';
  BD.appendChild(frag);
  _lastKids = [].slice.call(BD.childNodes);
  BD.scrollTop = top;
  stripCodes(BD);
  maskMoney(BD);
}

function maskOut(root) {
  stripCodes(root);
  maskMoney(root);
}

if (window.MutationObserver) {
  new MutationObserver((function() {
    maskOut(BD);
  })).observe(BD, {
    childList: true,
    subtree: true,
    characterData: true
  });
  new MutationObserver((function() {
    maskOut(DLG);
  })).observe(DLG, {
    childList: true,
    subtree: true,
    characterData: true
  });
}

function bioSheet(res, bal) {
  var buy = {};
  (bal && bal.holdings || []).forEach((function(x) {
    buy[nc(x['종목코드'])] = Number(x['매입금액'] || 0);
  }));
  var its = res.items || {}, held = [], waitOnly = [];
  Object.keys(its).forEach((function(c) {
    var it = its[c] || {};
    if (Number(it.hold) > 0) held.push(c); else waitOnly.push(c);
  }));
  held.sort((function(a, b) {
    return (buy[nc(b)] || 0) - (buy[nc(a)] || 0) || String(its[a].name).localeCompare(String(its[b].name));
  }));
  var rows = held.map((function(c) {
    var it = its[c], b = buy[nc(c)];
    var sub = '매수금액 ' + (b > 0 ? fmt(b) + '원' : '—') + (it.hold_pct != null ? ' · 순자산의 ' + bioPctTxt(it.hold_pct) : '') + (Number(it.wait) > 0 ? ' · 대기 주문 ' + fmt(it.wait) + '원' : '');
    return [ '🧪 ' + (it.name || c), function() {
      bioGoCard(c, it.name || c);
    }, false, {
      sub: sub
    } ];
  }));
  waitOnly.forEach((function(c) {
    var it = its[c];
    rows.push([ '🕒 ' + (it.name || c), null, false, {
      off: true,
      sub: '보유 없음 · 대기 주문 ' + fmt(it.wait) + '원' + (it.wait_pct != null ? ' (' + bioPctTxt(it.wait_pct) + ')' : '')
    } ]);
  }));
  var h = res.hold || {}, w = res.wait || {};
  askPick('🧪 바이오 ' + held.length + '종목', rows);
  DLG_MSG.appendChild(el('span', 'biosub', '보유 ' + fmt(h.amount) + '원' + (h.pct != null ? ' · 순자산의 ' + bioPctTxt(h.pct) : '') + ' · 대기 주문 ' + fmt(w.amount) + '원 · 줄을 누르면 그 종목 카드로'));
}

function obkPctTarget(total, pct) {
  var t = Math.trunc(Number(total) || 0), f = 1e4 + Math.round(Number(pct) * 100);
  if (!(t > 0) || !(f > 0)) return 0;
  var x = t * f + 5e7, q = Math.floor(x / 1e8);
  if (q * 1e8 > x) q -= 1; else if ((q + 1) * 1e8 <= x) q += 1;
  return q * 1e4;
}

function obkNewAmt(o, delta, pct) {
  var t = Number(o && o.total_amount) || 0;
  if (pct == null) return t + delta;
  var g = obkPctTarget(t, pct);
  return pct > 0 ? Math.max(g, t) : Math.min(g, t);
}

function obkPctTxt(x) {

  };
  var v = Math.abs(r.n);
  if (!(v > 0)) return {
    why: '%를 넣어 주세요'
  };
  if (Math.abs(v * 100 - Math.round(v * 100)) > 1e-6) return {
    why: '% 는 소수 둘째 자리까지만 됩니다 (받은 값 ' + obkPctTxt(sign < 0 ? -v : v) + '%)'
  };
  return {
    v: v
  };
}

function obkSplit(rows, delta, defBet, pct) {
  var below = [], stop = [], ids = [];
  var dn = pct == null ? delta < 0 : pct < 0;

    var op = Number(o.order_price) || 0, q = Number(o.quantity) || 0;

  }));
  return {

    below: below,
    stop: stop

function obkGo(rows, label, delta, defBet, pct) {
  var isP = pct != null;
  var m = Math.abs(delta) / 1e4, up = isP ? pct > 0 : delta > 0;
  var sp = obkSplit(rows, delta, defBet, isP ? pct : null);
  var why = [];
  if (sp.below.length) why.push('· 이미 기본(' + manWon(defBet) + ') 미만 ' + sp.below.length + '건은 감액하지 않습니다 (' + obkNames(sp.below) + ')');
  if (!sp.ids.length) {
    say('감액할 것이 없습니다\n' + why.join('\n') + '\n기본보다 적게는 보유 종목의 추가 매수 한도에 걸릴 때만 걸 수 있습니다.');
    return;
  }
  if (sp.stop.length) why.push('· ' + sp.stop.length + '건은 기본 베팅액(' + manWon(defBet) + ')에서 멈춥니다 (' + obkNames(sp.stop) + ')');
  if (up) why.push('· 보유 종목은 추가 매수 한도까지만 올립니다');
  var expect = {};
  rows.forEach((function(o) {
    if (o.total_amount != null && o.total_amount !== '') expect[String(o.order_id)] = Number(o.total_amount);
  }));
  ask('«' + label + '» 대기 매수 ' + sp.ids.length + '건을 ' + (isP ? '각 베팅액의 ' + Math.abs(pct) + '%만큼' : m + '만원씩') + ' ' + (up ? '올립니다.' : '내립니다.') + (isP ? '\n· 새 금액은 만원 단위로 반올림합니다' : '') + (why.length ? '\n' + why.join('\n') : '') + '\n되돌리려면 컴퓨터 주문창의 [↩ 되돌리기] 가 필요합니다.', (function() {
    obkRun(sp.ids, delta, defBet, expect, isP ? pct : null);
  }), !up);
}

function obkRun(ids, delta, defBet, expect, pct) {
  if (BOT.busy) return;
  BOT.busy = true;
  var isP = pct != null;
  var m = Math.abs(delta) / 1e4, lbl = isP ? (pct > 0 ? '+' : '-') + Math.abs(pct) + '%' : (delta > 0 ? '+' : '-') + m + '만원';
  var pre = {
    upd: [],
    skip: [],
    cap: []
  };
  function fail(x) {
    BOT.busy = false;
    dropCache();
    if (isP && x.j && /delta_won required/.test(String(x.j.error || ''))) {
      say(OBK_PCT_OLD, (function() {
        go(TAB);
      }));
      return;
    }
    say('일괄 처리 실패 — ' + (x.j && (x.j.msg || x.j.error) || '응답 ' + x.r.status), (function() {
      go(TAB);
    }));
  }
  function done(x, delZero, cancelled) {
    BOT.busy = false;
    dropCache();
    if (!x.r.ok) return fail(x);
    var j = x.j, nUpd = (j.updated || []).length + pre.upd.length, nDel = (j.deleted || []).length;
    var msg = '일괄 ' + lbl + ' 적용 (' + nUpd + '건)' + (delZero ? ' · ' + nDel + '건 삭제' : cancelled ? ' · 0이하 삭제 취소' : '');
    var cap = (j.capped || []).concat(pre.cap);
    if (cap.length) msg += ' · ' + cap.length + '건은 추가 매수 한도까지만';
    var sk = (j.skipped || []).concat(pre.skip);
    if (sk.length) {
      msg += ' · ' + sk.length + '건 건너뜀\n\n건드리지 않은 주문:\n' + sk.map((function(s) {
        var nm = String(s.name || s.order_id || ''), rs = String(s.reason || '');
        if (nm && rs.indexOf(nm + ' — ') === 0) rs = rs.slice(nm.length + 3);
        return '· ' + nm + ' — ' + rs;
      })).join('\n');
    }
    say(msg, (function() {
      go(TAB);
    }));
  }
  obkPost(ids, delta, defBet, {
    preview: true
  }, pct).then((function(p) {
    if (!p.r.ok) return fail(p);
    var td = p.j.to_delete || [];
    if (!td.length) {
      return obkPost(ids, delta, defBet, {
        expect: expect,
        delete_zero: false,
        confirmed_delete_ids: []
      }, pct).then((function(x) {
        done(x, false, false);
      }));
    }
    var delSet = {};
    td.forEach((function(x) {
      delSet[String(x.order_id)] = 1;
    }));
    var keep = ids.filter((function(id) {
      return !delSet[String(id)];
    }));
    var rest = ids.filter((function(id) {
      return delSet[String(id)];
    }));
    var first = keep.length ? obkPost(keep, delta, defBet, {
      expect: expect,
      delete_zero: false
    }, pct) : Promise.resolve(null);
    return first.then((function(q) {
      if (q && !q.r.ok) return fail(q);
      if (q) {
        pre.upd = q.j.updated || [];
        pre.skip = q.j.skipped || [];
        pre.cap = q.j.capped || [];
      }
      BOT.busy = false;
      var names = td.map((function(x) {
        return x.name || x.order_id;
      })).join(', ');
      ask('다음 종목은 베팅액이 0 이하가 됩니다:\n' + names + '\n\n계속하면 삭제됩니다. (나머지 ' + pre.upd.length + '건은 이미 적용했습니다)\n' + '⚠ 확인 전까지 이 주문들은 원래 크기로 살아 있습니다.', (function() {}), true);
      var conf = td.map((function(x) {
        return String(x.order_id);
      }));
      DLG_CB = function(v) {
        BOT.busy = true;
        obkPost(rest, delta, defBet, {
          expect: expect,
          delete_zero: !!v,
          confirmed_delete_ids: v ? conf : []
        }, pct).then((function(x) {
          done(x, !!v, !v);
        })).catch((function(e) {
          BOT.busy = false;
          say('실패 — ' + e.message);
        }));
      };
    }));
  })).catch((function(e) {
    BOT.busy = false;
    dropCache();
    say('실패 — ' + e.message, (function() {
      go(TAB);
    }));
  }));
}

}

function arParse(v, isInt) {
  var raw = String(v == null ? '' : v).trim();
  var s = raw.replace(/[−–]/g, '-').replace(/\s*(%|배|틱)$/, '');
  if (!s) return {
    why: '숫자를 넣어 주세요'
  };
  if (s.indexOf(',') >= 0) {
    if (!/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return {
      why: '«' + raw + '» — 쉼표는 천 단위(1,000)에만 씁니다' + (isInt ? '' : ' · 소수점은 «.» 로')
    };
    s = s.replace(/,/g, '');
  }
  if (isInt ? !/^\d+$/.test(s) : !/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return {
    why: '«' + raw + '» — ' + (isInt ? '정수로 넣어 주세요 (소수점·글자는 안 됩니다)' : '숫자로 넣어 주세요 (예: 5 · 2.5)')
  };
  var n = parseFloat(s);
  return isFinite(n) ? {
    n: n
  } : {
    why: '«' + raw + '» — 숫자로 넣어 주세요'
  };
}

function arNum(v, isInt) {
  var r = arParse(v, isInt);
  return r.why ? null : r.n;
}

function arAskNum(msg, preset, cb, isInt) {
  askVal(msg, preset, (function(v) {
    var r = arParse(v, isInt);
    if (r.why) {
      say(r.why + '\n저장하지 않았습니다.');
      return;
    }
    cb(r.n);
  }), true);
}

function arEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[c];
  }));
}

function chTouch(wrap) {
  if (wrap._chTouchOn) return;
  wrap._chTouchOn = true;

  }
  function mid(t) {

    var total = chTotal();

    CH.end = Math.max(0, Math.min(total - CH.n, CH.end));
  }
  function barAt(px) {
    var w = wrap.clientWidth || 360;
    var total = chTotal();
    return total - CH.n - CH.end + px / w * CH.n;
  }
  wrap.addEventListener('touchstart', (function(ev) {
    if (!CH.bars.length) return;
    if (ev.touches.length >= 2 && ev.cancelable) ev.preventDefault();
    n0 = CH.n;
    end0 = CH.end;
    clearTimeout(holdT);
    if (ev.touches.length === 2) {
      mode = 'zoom';
      d0 = dist(ev.touches);
      anchor = barAt(mid(ev.touches));
      CH.cross = null;
    } else {
      mode = 'pan';
      x0 = ev.touches[0].clientX;
      var px = ev.touches[0].clientX - wrap.getBoundingClientRect().left;
      holdT = setTimeout((function() {
        mode = 'cross';
        CH.cross = px;
        chDraw();
      }), 320);
    }
  }), {
    passive: false
  });

    if (!CH.bars.length) return;
    if (ev.cancelable) ev.preventDefault();
    if (ev.touches.length === 2 && mode === 'zoom') {

      var total = chTotal();
      CH.n = Math.max(15, Math.min(CH_MAX, Math.min(total, CH.n)));

    passive: false
  });

          say('몇 주인지 못 셌습니다 — ' + (e && e.message || e));
        }));
      }), true);
    }, false, {
      sub: '보유 ' + fmt(p.total_qty) + '주의 몇 %'
    } ]);
  } else {
    items.push([ '✏️ % 직접 입력', null, false, {
      off: true,
      sub: '컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (장 마감 뒤 데이터 업데이트 때 자동)'
    } ]);
  }
  var sp = snPxSrc(code, p);
  var amtLab = '✏️ 금액 직접 입력 (' + SN_AMT_UNIT.label + ')';
  if (!p.qty_ok) {
    items.push([ amtLab, null, false, {
      off: true,
      sub: '컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (장 마감 뒤 데이터 업데이트 때 자동)'
    } ]);
  } else if (sp.px > 0) {
    items.push([ amtLab, function() {
      askVal('매도 금액 (' + SN_AMT_UNIT.label + ')', '', (function(v) {
        var won = snWonOf(v);
        if (won == null) return;
        var s2 = snPxSrc(code, p);
        if (!(s2.px > 0)) {
          say('팔지 않습니다 — 지금 값을 못 받아 몇 주인지 셀 수 없습니다\n(받아 둔 잔고 값이 묵었습니다 · % 로 팔거나 창을 다시 열어 주세요)');
          return;
        }
        var q = snWonQty(won, s2.px, p.total_qty, s2.pre);
        if (q.why) {
          say(q.why);
          return;
        }
        sellWonAsk(code, nm2, won, q, s2, p.total_qty);
      }), true);
    }, false, {
      sub: sp.pre + ' ' + fmt(sp.px) + '원 기준 · 평가 ' + fmt(sp.px * Number(p.total_qty || 0)) + '원 · 예: ' + snAmtEx() + ' (주수는 내림)'
    } ]);
  } else {
    items.push([ amtLab, null, false, {
      off: true,
      sub: '지금 값을 못 받아 몇 주인지 셀 수 없습니다'
    } ]);
  }
  return items;
}

var SN_AMT_UNIT = {
  won: 1e4,
  label: '만원'
};

function snAmtEx() {
  return String(15e5 / SN_AMT_UNIT.won) + ' = 150만원어치';
}

var SN_BAL_PX_MAX_MS = 15e3;

function snBalPx(code) {
  var c = JC['/api/balance'], d = c && c.data || {};
  if (!c || !(Date.now() - Number(c.ts) <= SN_BAL_PX_MAX_MS) || d.cache_meta) return {
    px: 0
  };
  var hs = d.holdings || [];
  for (var i = 0; i < hs.length; i++) {
    if (nc(hs[i]['종목코드']) === nc(code)) {
      var v = Number(hs[i]['현재가']);
      return isFinite(v) && v > 0 ? {
        px: v,
        at: Number(c.ts)
      } : {
        px: 0
      };
    }
  }
  return {
    px: 0
  };
}

function snPxSrc(code, p) {
  var v = Number(p && p.price);
  if (v > 0) return {
    px: v,
    pre: '지금'
  };
  var b = snBalPx(code);
  return b.px > 0 ? {
    px: b.px,
    pre: '잔고 ' + clockHMS(b.at) + ' 값'
  } : {
    px: 0,
    pre: ''
  };
}

function clockHMS(ms) {
  var t = new Date(Number(ms) || Date.now());
  return ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
}

function snWonOf(v) {
  var s = String(v).replace(/[\s,]/g, ''), mul = SN_AMT_UNIT.won;
  if (/만원?$/.test(s)) {
    s = s.replace(/만원?$/, '');
    mul = 1e4;
  } else if (/원$/.test(s)) {
    s = s.slice(0, -1);
    mul = 1;
  }
  if (!/^\d+$/.test(s)) {
    say('금액은 ' + SN_AMT_UNIT.label + ' 단위 정수로 적어 주세요 (소수점·글자는 안 됩니다 · 예: ' + snAmtEx() + ')');
    return null;
  }
  var n = parseInt(s, 10) * mul;
  if (!(n > 0)) {
    say('0 보다 큰 금액을 적어 주세요 (예: ' + snAmtEx() + ')');
    return null;
  }
  return n;
}

function snWonQty(won, px, held, pre) {
  var h = Math.floor(Number(held) || 0), p = Number(px);
  if (!(p > 0)) return {
    why: '팔지 않습니다 — 지금 값을 몰라 몇 주인지 셀 수 없습니다'
  };
  if (!(h > 0)) return {
    why: '팔지 않습니다 — 보유 수량이 없습니다'
  };
  var q = Math.floor(won / p), cut = false;
  if (q < 1) return {
    why: '팔지 않습니다 — ' + fmt(won) + '원으로는 1주도 안 됩니다 (' + (pre || '지금') + ' 1주 ' + fmt(p) + '원 · 주수는 내림)'
  };
  if (q > h) {
    q = h;
    cut = true;
  }
  return {
    qty: q,
    all: q >= h,
    cut: cut
  };
}

function sellWonAsk(code, nm, won, q, src, held) {
  var px = src.px;
  ask('«' + nm + '» ' + fmt(q.qty) + '주 · 약 ' + fmt(q.qty * px) + '원을 지금 시장가로 팝니다.\n' + '(적은 금액 ' + fmt(won) + '원 · ' + src.pre + ' ' + fmt(px) + '원 기준 내림' + (q.cut ? ' · 보유보다 많아 보유 ' + fmt(held) + '주 전부' : q.all ? ' = 전량' : ' · 보유 ' + fmt(held) + '주') + ' · 신용분부터)\n' + '값이 움직이면 실제 금액은 조금 달라집니다 (주수는 그대로).\n\n' + '시장가라 바로 체결되고 되돌릴 수 없습니다.', (function() {
    sellNowSend(code, nm, null, q.qty);
  }), true);
}

function snPctOf(v) {
  var s = String(v).replace(/[\s,%]/g, '');
  if (!/^\d+$/.test(s)) {
    say('1~100 사이 정수로 적어 주세요 (소수점은 안 됩니다 · 100 = 전량)');
    return null;
  }
  var n = parseInt(s, 10);
  if (!(n >= 1 && n <= 100)) {
    say('1~100 사이 숫자로 적어 주세요 (100 = 전량)');
    return null;
  }
  return n;
}

function snManOf(v) {
  var s = String(v).replace(/[\s,]/g, '').replace(/만원?$/, '');
  if (!/^\d+$/.test(s)) {
    say('만원 단위 정수로 적어 주세요 (소수점은 안 됩니다 · 예: 150 = 150만원)');
    return null;
  }
  var m = parseInt(s, 10);
  if (!(m > 0)) {
    say('만원 단위 숫자로 적어 주세요 (예: 150 = 150만원)');
    return null;
  }
  return m;
}

var SO_URL = '/api/sell/open';

var SO_HOW = '그날 08:55 장 시작 동시호가에 시장가로 넣어 09:00 시가에 팝니다 · 그때 못 내면 09:00~15:20 동안 30초마다 다시 봐서 그때 시장가로 냅니다 (거부되면 한 번만 더)';

function soDay(iso) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '다음 거래일';
  var dt = new Date(+m[1], +m[2] - 1, +m[3]);
  return +m[2] + '/' + m[3] + '(' + '일월화수목금토'[dt.getDay()] + ')';
}

function soWhen(iso) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return soDay(iso);
  var t = new Date;
  t.setHours(0, 0, 0, 0);
  var n = Math.round((new Date(+m[1], +m[2] - 1, +m[3]) - t) / 864e5);
  return (n === 0 ? '오늘 ' : n === 1 ? '내일 ' : '') + soDay(iso);
}

function soWhat(it) {
  if (it && Number(it.amount) > 0) return fmt(Math.round(Number(it.amount) / 1e4)) + '만원어치';
  return it && Number(it.pct) >= 100 ? '전량' : (it && it.pct) + '%';
}

function soList() {
  return fetch(SO_URL, {
    headers: {
      Accept: 'application/json'
    },
    cache: 'no-store'
  }).then((function(r) {
    if (r.status === 404) return {
      old: true
    };
    if (!r.ok) return {
      err: 'HTTP ' + r.status
    };
    return r.json().then((function(j) {
      return j && j.ok !== false ? j : {
        err: j && j.error || '답이 비었습니다'
      };
    }));
  })).catch((function(e) {
    return {
      err: e && e.message || String(e)
    };
  }));
}

function soUsable(so) {
  return !!(so && !so.old && !so.err && so.run_date);
}

function soWhyNot(so) {
  if (!so || so.old) return '🌅 다음 거래일 시가 매도 예약은 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다';
  if (so.err) return '🌅 시가 매도 예약 상태를 못 읽었습니다 — ' + so.err;
  return '🌅 다음 거래일을 못 찾아 시가 매도 예약을 걸 수 없습니다';
}

function snPick(code, nm, p, so, mode) {
  var ok = soUsable(so);
  askPick('', mode === 'open' ? snOpenItems(code, nm, p, so) : snNowItems(code, nm, p));
  var head = el('div', 'snhead'), bar = el('div', 'snmode');
  var bNow = el('button', mode === 'now' ? 'on' : '', '📤 지금 팔기');
  var bOpen = el('button', mode === 'open' ? 'on' : '', '🌅 ' + (ok ? soDay(so.run_date) : '다음 거래일') + ' 시가');
  bNow.disabled = !p.open;
  bOpen.disabled = !ok;
  bNow.onclick = function() {
    if (mode !== 'now') snPick(code, nm, p, so, 'now');
  };
  bOpen.onclick = function() {
    if (mode !== 'open') snPick(code, nm, p, so, 'open');
  };
  bar.appendChild(bNow);
  bar.appendChild(bOpen);
  head.appendChild(bar);
  if (!p.open) head.appendChild(el('div', 'snwhy', '📤 지금은 못 팝니다 — ' + (p.why || '장 시간이 아닙니다')));
  if (!ok) head.appendChild(el('div', 'snwhy', soWhyNot(so))); else if (mode === 'open') head.appendChild(el('div', 'snwhy', '🌅 ' + SO_HOW));
  DLG_PICK.insertBefore(head, DLG_PICK.firstChild);
  (ok ? so.items || [] : []).forEach((function(it) {
    if (nc(it.code) === nc(code)) DLG_PICK.appendChild(soLine(it, soAfter));
  }));
}

function snOpenItems(code, nm, p, so) {
  var day = soDay(so.run_date);
  var tail = '\n\n' + SO_HOW + '.\n값은 정할 수 없습니다(시장가). 그 전에는 [잔고] 위 예약 줄에서 지울 수 있습니다.';
  var items = [];
  items.push([ '🔴 전량 매도', function() {
    ask('«' + nm + '» 보유 ' + fmt(p.total_qty) + '주 전량을\n' + day + ' 09:00 시가에 팔도록 예약합니다.\n' + '(신용분부터 · 주수는 그날 보유로 다시 셉니다)' + tail, (function() {
      sellOpenSend(code, nm, {
        pct: 100
      });
    }), true);
  }, true, {
    sub: '보유 ' + fmt(p.total_qty) + '주 전부 · ' + day + ' 시가'
  } ]);
  items.push([ '✏️ % 직접 입력', function() {
    askVal(day + ' 시가 매도 비율 (1~100 %)', '', (function(v) {
      var n = snPctOf(v);
      if (n == null) return;
      fetch('/api/bot/sell_now/preview?code=' + encodeURIComponent(code) + '&pct=' + n, {
        headers: {
          Accept: 'application/json'
        },
        cache: 'no-store'
      }).then((function(r) {
        return r.json();
      })).catch((function() {
        return null;
      })).then((function(q) {
        var cq = q && q.ok !== false && q.custom_pct ? q.custom_pct.qty : null;
        var what = n >= 100 ? '보유 전량을' : '보유의 ' + n + '%' + (cq != null ? '(지금 보유 ' + fmt(q.total_qty) + '주 기준 ' + fmt(cq) + '주)' : '') + '를';
        ask('«' + nm + '» ' + what + '\n' + day + ' 09:00 시가에 팔도록 예약합니다.\n' + '(신용분부터 · 주수는 그날 보유로 다시 셉니다)' + tail, (function() {
          sellOpenSend(code, nm, {
            pct: n
          });
        }), true);
      }));
    }), true);
  }, false, {
    sub: '보유 ' + fmt(p.total_qty) + '주의 몇 % · ' + day + ' 시가'
  } ]);
  items.push([ '✏️ 금액 직접 입력 (만원)', function() {
    askVal(day + ' 시가 매도 금액 (만원)', '', (function(v) {
      var m = snManOf(v);
      if (m == null) return;
      ask('«' + nm + '» ' + fmt(m) + '만원어치를\n' + day + ' 09:00 시가에 팔도록 예약합니다.\n' + '(주수는 그날 주문을 내는 순간 값으로 셉니다 · 보유보다 많으면 전량 · 신용분부터)' + tail, (function() {
        sellOpenSend(code, nm, {
          amount_man: m
        });
      }), true);
    }), true);
  }, false, {
    sub: '예: 150 = 150만원어치 · 주수는 그날 주문을 내는 순간 값으로 셉니다'
  } ]);
  return items;
}

function soAfter() {
  if (TAB === 'balance') renderBalance();
}

function sellOpenSend(code, nm, amt) {
  if (BOT.busy) return;
  BOT.busy = true;
  var body = {
    code: code,
    name: nm
  };
  if (amt.amount_man) body.amount_man = amt.amount_man; else body.pct = amt.pct;
  fetch(SO_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    return r.json().catch((function() {
      return null;
    })).then((function(j) {
      return {
        r: r,
        j: j || {}
      };
    }));
  })).then((function(x) {
    BOT.busy = false;
    var r = x.r, j = x.j;
    if (r.status === 404 && !j.error) {
      say('예약하지 않았습니다 — 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (HTTP 404)');
      return;
    }
    if (r.status === 409) {
      say('예약하지 않았습니다 — ' + (j.error || '그날 이 종목 시가 매도 예약이 이미 있습니다') + '\n\n걸린 예약은 [잔고] 위 예약 줄에서 지울 수 있습니다.');
      return;
    }
    if (!r.ok || !j.ok) {
      say('예약하지 않았습니다 — ' + (j.error || j.msg || 'HTTP ' + r.status));
      return;
    }
    delete JC[SO_URL];
    var it = j.item || {
      pct: body.pct || 0,
      amount: body.amount_man ? body.amount_man * 1e4 : null
    };
    toast('🌅 «' + nm + '» ' + soDay(j.run_date) + ' 시가에 ' + soWhat(it) + ' 매도 예약', 3200, true);
    soAfter();
  })).catch((function(e) {
    BOT.busy = false;
    say('예약하지 않았습니다 — ' + (e && e.message || e));
  }));
}

function soLine(it, after) {
  var w = el('div', 'soline');
  w.setAttribute('data-fp', fpOf(it));
  w.appendChild(el('span', '', '🌅 ' + soWhen(it.run_date) + ' 시가 매도 예약: ' + (it.name || it.code) + ' ' + soWhat(it)));
  var b = el('button', '', '지우기');
  b.onclick = function() {
    soCancel(it, after);
  };
  w.appendChild(b);
  return w;
}

function soCancel(it, after) {
  ask('«' + (it.name || it.code) + '» ' + soDay(it.run_date) + ' 시가 매도 예약(' + soWhat(it) + ')을 지웁니다.\n지우면 그날 팔지 않습니다.', (function() {
    fetch(SO_URL + '/' + encodeURIComponent(it.req_id), {
      method: 'DELETE',
      headers: {
        Accept: 'application/json'
      }
    }).then((function(r) {
      return r.json().catch((function() {
        return null;
      })).then((function(j) {
        return {
          r: r,
          j: j || {}
        };
      }));
    })).then((function(x) {
      if (x.r.status === 404 && !x.j.error) {
        say('지우지 못했습니다 — 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (HTTP 404)');
        return;
      }
      if (!x.r.ok || x.j.ok === false) {
        say('지우지 못했습니다 — ' + (x.j.error || 'HTTP ' + x.r.status));
        return;
      }
      delete JC[SO_URL];
      toast('🌅 «' + (it.name || it.code) + '» 시가 매도 예약을 지웠습니다', 2600, true);
      if (after) after();
    })).catch((function(e) {
      say('지우지 못했습니다 — ' + (e && e.message || e));
    }));
  }));
}

function soBox(d) {
  if (!d) return null;
  if (d.__err) {
    var em = String(d.__err && d.__err.message || d.__err);
    return /HTTP 404/.test(em) ? null : el('div', 'mut', '🌅 시가 매도 예약 목록을 못 읽었습니다 — ' + em);
  }
  var items = d.items || [];
  if (!items.length) return null;
  var c = el('div', 'card sobox');
  items.forEach((function(it) {
    c.appendChild(soLine(it, soAfter));
  }));
  c.appendChild(infoLine('mut', '09:00 시가에 시장가로 팝니다', SO_HOW + '.'));
  return c;
}

function snUnsure(nm, why) {
  say('⚠ «' + nm + '» 답을 못 받았습니다 (' + why + ')\n보내졌을 수 있습니다 — 매매 알림과 [잔고] 를 확인해 주세요');
}

function sellNowSend(code, nm, pct, qty) {
  if (BOT.busy) return;
  BOT.busy = true;
  var body = qty ? {
    code: code,
    qty: qty
  } : {
    code: code,
    pct: pct
  };
  fetch('/api/bot/sell_now', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    return r.json().then((function(j) {
      return {
        r: r,
        j: j
      };
    }), (function() {
      return {
        r: r,
        j: null,
        bad: true
      };
    }));
  })).then((function(x) {
    BOT.busy = false;
    var r = x.r, j = x.j;
    if (r.ok && (x.bad || !j || typeof j !== 'object')) {
      snUnsure(nm, 'HTTP ' + r.status + ' · 답을 끝까지 못 읽었습니다');
      return;
    }
    if (r.status === 404) {
      say('팔지 않았습니다 — 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (HTTP 404)');
      return;
    }
    if (!r.ok || !j || !j.ok) {
      say('팔지 않았습니다 — ' + (j && (j.error || j.msg) || 'HTTP ' + r.status));
      return;
    }
    if (!j.req_id) {
      snUnsure(nm, '요청 번호가 답에 없습니다');
      return;
    }
    toast('📤 매도 요청을 보냈습니다 — 자동매매가 곧 냅니다', 3e3, true);
    var t0 = Date.now();
    (function poll() {
      fetch('/api/bot/sell_now/' + encodeURIComponent(j.req_id), {
        headers: {
          Accept: 'application/json'
        },
        cache: 'no-store'
      }).then((function(r) {
        return r.json();
      })).then((function(s) {

    var who = S.locked ? '' : '고른 종목의 ', what = pct >= 100 ? '보유 전량을' : '보유의 ' + pct + '%를';
    var note = mode === 'now' ? '· ' + who + what + ' 지금 시장가로 팝니다 · 종목마다 신용분부터\n' + (pct < 100 ? '· 주수는 파는 순간 보유로 다시 셉니다 (반올림 · 1주 미만도 1주)\n' : '') + '· 한 종목씩 차례로 보냅니다 — 화면을 닫아도 컴퓨터가 끝까지 팝니다\n· 바로 체결되고 되돌릴 수 없습니다' : '· ' + day + ' 09:00 시가에 ' + who + what + ' 팝니다 · 종목마다 신용분부터\n' + '· 08:55 장 시작 동시호가에 시장가로 넣습니다 · 주수는 그날 보유로 다시 셉니다\n· 그 전에는 [잔고] 위 예약 줄에서 종목마다 지울 수 있습니다';
    var bn = gsBuysNote(sc, pct, cur, S);
    if (bn) note += '\n· ' + bn;
    if (S.locked && cur.all) note = '· 칩과 상관없이 보유 전체 ' + n + '종목입니다\n' + note;
    body.appendChild(el('div', 'gsnote', note));
    body.scrollTop = by;
    var can = (mode === 'now' ? !!cur.open : !!cur.open_run_date) && !over;
    DLG_OK.style.display = can ? '' : 'none';
    DLG_OK.className = 'r gsok gsk' + (st.ok && !st.load && n ? '' : ' gsoff') + (nSel ? '' : ' gsnone');
    var hd = S.locked ? '' : '고른 ';
    DLG_OK.textContent = '';
    DLG_OK.appendChild(el('span', 'gsk1', !nSel ? (mode === 'now' ? '🔴' : '🌅') + ' 고를 종목을 눌러 주세요' : mode === 'now' ? pct >= 100 ? '🔴 ' + hd + n + '종목 전량 매도' : '🔴 ' + hd + n + '종목 보유 ' + pct + '% 매도' : pct >= 100 ? '🌅 ' + hd + n + '종목 시가 예약' : '🌅 ' + hd + n + '종목 시가 예약 (보유 ' + pct + '%)'));
    if (n) DLG_OK.appendChild(el('small', 'gsk2', gsTotLine(send)));
  }
  function ask_(n, then) {
    var my_rq = ++rq;
    fetch(gsPrevUrl(S.entry) + (S.locked ? '' : '&pick=1') + '&pct=' + n, {
      headers: {
        Accept: 'application/json'
      },
      cache: 'no-store'
    }).then((function(r) {
      return r.json();
    })).then((function(q) {
      if (my_rq !== rq || !(then || alive())) return;
      if (!q || q.ok === false || !q.pct_ok || Number(q.pct) !== n || !(q.items || []).length || !S.locked && q.pick_ok !== true) {
        st = {
          ok: false,
          why: '몇 주인지 못 셌습니다 — ' + (q && q.error || '답이 비었습니다')
        };
        if (then) {
          gsPick(S, mode, String(n));
          return;
        }
        paint();
        return;
      }
      S.p = cur = q;
      st = {
        ok: true,
        n: n,
        load: false
      };
      if (then) {
        then(cur);
        return;
      }
      setTitle();
      paint();
    })).catch((function(e) {
      if (my_rq !== rq || !(then || alive())) return;
      st = {
        ok: false,
        why: '몇 주인지 못 셌습니다 — ' + (e && e.message || e)
      };
      if (then) {
        gsPick(S, mode, String(n));
        return;
      }
      paint();
    }));
  }
  function check() {
    clearTimeout(timer);
    if (!cur.pct_ok) return;
    var r = gsPctOf(inp.value);
    if (r.why) {
      rq++;
      st = {
        ok: false,
        why: r.why
      };
      paint();
      return;
    }
    if (r.n === gsPctIs(cur)) {
      rq++;
      st = {
        ok: true,
        n: r.n,
        load: false
      };
      paint();
      return;
    }
    st = {
      ok: true,
      n: r.n,
      load: true
    };
    paint();
    timer = setTimeout((function() {
      ask_(r.n);
    }), 300);
  }
  if (!cur.pct_ok) {
    inp.value = '100';
    inp.disabled = true;
  }
  inp.addEventListener('input', check);
  if (cur.pct_ok) check(); else paint();
  DLG_CB = function(v) {
    if (!v) return;
    clearTimeout(timer);
    var r = cur.pct_ok ? gsPctOf(inp.value) : {
      n: 100
    };
    var nn = gsSendItems(gsScope(S)).length;
    if (r.why || gsOver(cur, nn)) {
      gsPick(S, mode, inp.value);
      return;
    }
    if (r.n !== gsPctIs(cur)) {
      toast('몇 주인지 세는 중…', 1500);
      ask_(r.n, (function() {
        gsConfirm(S, mode);
      }));
      return;
    }
    if (!nn) {
      gsPick(S, mode, inp.value);
      return;
    }
    gsConfirm(S, mode);
  };
}

function gsConfirm(S, mode) {
  var p = S.p, pct = gsPctIs(p), sc = gsScope(S), bn = gsBuysNote(sc, pct, p, S);
  var sel = gsSendItems(sc), skip = sc.items.filter((function(it) {
    return !(gsSq(it) > 0);
  }));
  if (!sel.length || gsOver(p, sel.length)) {
    gsPick(S, mode);
    return;
  }
  var lines = sel.map((function(it) {
    return '· ' + (it.name || it.code) + ' ' + (pct >= 100 ? fmt(it.qty) + '주' : fmt(it.qty) + '주 중 ' + fmt(gsSq(it)) + '주');
  })).join('\n');
  if (skip.length) lines += '\n' + skip.map((function(it) {
    return '· ' + (it.name || it.code) + ' 0주 — 안 팖';
  })).join('\n');
  var nm = gsNameN(sc, sel.length);
  var msg = mode === 'now' ? (pct >= 100 ? nm + ' 전량을 지금 시장가로 팝니다.\n(종목마다 신용분부터 · 한 종목씩 차례로)\n\n' : nm + ' 보유의 ' + pct + '%를 지금 시장가로 팝니다.\n' + '(종목마다 신용분부터 · 한 종목씩 차례로 · 주수는 파는 순간 보유로 다시 셉니다)\n\n') + lines + '\n\n시장가라 바로 체결되고 되돌릴 수 없습니다.\n화면을 닫아도 컴퓨터가 끝까지 팝니다.' : nm + ' ' + (pct >= 100 ? '보유 전량을' : '보유의 ' + pct + '%를') + '\n' + soDay(p.open_run_date) + ' 09:00 시가에 팔도록 예약합니다.\n' + '(종목마다 신용분부터 · 주수는 그날 보유로 다시 셉니다)\n\n' + lines;
  if (gsExLine(p) && (sc.scope === 'all' || sc.scope === 'locked')) msg += '\n\n' + gsExLine(p);
  if (bn) msg += '\n\n' + bn + '.';
  ask(msg, (function() {
    gsSend(S, mode, sc);
  }), true);
}

function gsExLine(p) {
  var ex = p && p.excluded || [];
  if (!ex.length) return '';
  return '제외: ' + ex.map((function(x) {
    return (x.name || x.code) + '(' + (x.why || '시세 없음') + ')';
  })).join(', ');
}

function gsOver(p, n) {
  var mx = Number(p && p.max_items);
  if (!(mx > 0) || !(n > mx)) return '';
  return '⛔ 팔 종목이 ' + n + '개라 한 번에 팔 수 있는 ' + mx + '종목을 넘습니다 — 아무것도 보내지 않습니다\n' + '칩으로 나눠 팔거나 종목마다 «바로 매도» 로 팔아 주세요';
}

function gsSend(S, mode, sc) {
  if (BOT.busy) return;
  BOT.busy = true;
  var p = S.p, none = mode === 'now' ? '팔지 않았습니다' : '예약하지 않았습니다';
  var send = gsSendItems(sc);
  var body = {
    key: sc.key,
    mode: mode,
    items: send.map((function(it) {
      return {
        code: it.code,
        name: it.name,
        qty: gsSq(it)
      };
    }))
  };
  if (p.pct_ok) body.pct = gsPctIs(p);
  if (sc.buys && Array.isArray(sc.buys.ids)) body.buy_ids = sc.buys.ids;
  var bp = {
    key: sc.key,
    label: sc.label,
    all: !!sc.all,
    scope: sc.scope,
    items: send,
    pct: p.pct,
    pct_ok: p.pct_ok
  };
  fetch(GS_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json'
    },
    body: JSON.stringify(body)
  }).then((function(r) {
    return r.json().then((function(j) {
      return {
        r: r,
        j: j || {}
      };
    }), (function() {
      return {
        r: r,
        j: {},
        bad: true
      };
    }));
  })).then((function(x) {
    BOT.busy = false;
    var r = x.r, j = x.j;
    if (x.bad && r.ok) {
      gsUnsure('HTTP ' + r.status + ' · 답을 끝까지 못 읽었습니다');
      return;
    }
    if (r.status === 404 && !j.error) {
      say(none + ' — 컴퓨터 서버를 다시 켠 뒤에 쓸 수 있습니다 (HTTP 404)');
      return;
    }
    if (!r.ok || !j.ok) {
      say(none + ' — ' + (j.error || j.msg || 'HTTP ' + r.status));
      return;
    }
    dropCache();
    if (mode === 'now') gsBoard(j.batch_id, bp, j); else gsOpenDone(bp, j);
  })).catch((function(e) {
    BOT.busy = false;
    gsUnsure(e && e.message || e);
  }));
}

function gsUnsure(why) {
  say('⚠ 답을 못 받았습니다 (' + why + ')\n보내졌을 수 있습니다 — 매매 알림과 [잔고] 를 확인해 주세요');
}

function gsBoardRow(it) {
  var st = it.status, q = it.qty || it.snap_qty, b, sub, bad = false;
  if (st === 'queued') {
    b = [ '', '⌛ 대기' ];
    sub = fmt(it.snap_qty) + '주 · 차례 기다림';
  } else if (st === 'pending' || st === 'firing') {
    b = [ 'go', '⏳ 보내는 중' ];
    sub = fmt(it.snap_qty) + '주 · 결과 기다리는 중';
  } else if (st === 'done') {
    b = [ 'ok', '✅ 접수' ];
    sub = fmt(q) + '주 시장가 매도 접수';
  } else if (st === 'open_ok') {
    b = [ 'ok', '✅ 예약' ];
    sub = it.message || '';
  } else if (st === 'unknown') {
    b = [ 'unk', '⚠ 모름' ];
    sub = it.message || '접수 여부를 모릅니다';
    bad = true;
  } else {
    b = [ 'bad', '❌ 실패' ];
    sub = it.message || st;
    bad = true;
  }
  var r = el('div', 'gsit'), l = el('span', 'gl');
  r.setAttribute('data-st', st || '');
  l.appendChild(el('span', 'gn', it.name || it.code));
  l.appendChild(el('span', 'gs' + (bad ? ' bad' : ''), sub));
  r.appendChild(l);
  r.appendChild(el('span', 'gsbadge ' + b[0], b[1]));
  return r;
}

function gsBuysLine(buys, p) {
  if (!buys) return null;
  if (buys.error) return el('div', 'gshd bad', '🗑 ' + buys.error);
  var t = buys.deleted ? (p && p.all ? '🗑 걸려 있던 대기 매수 ' : p && p.scope === 'pick' ? '🗑 고른 종목에 걸려 있던 대기 매수 ' : '🗑 이 칩의 대기 매수 ') + buys.deleted + '건도 지웠습니다' : '';
  if (buys.failed && buys.failed.length) t += (t ? ' · ' : '🗑 ') + '못 지운 것 ' + buys.failed.length + '건(발사 중이거나 이미 없음)';
  return t ? el('div', 'gshd', t) : null;
}

function gsBoard(bid, p, first) {
  var my = ++GS_SEQ, t0 = Date.now(), fin = false;
  askPick('', []);
  function alive() {
    var w = DLG_PICK.firstChild;
    return my === GS_SEQ && DLG.classList.contains('on') && DLG_PICK.style.display !== 'none' && w && w.getAttribute && w.getAttribute('data-gs') === String(my);
  }
  function draw(s, late) {
    var its = s && s.items || p.items.filter((function(it) {
      return gsSq(it) > 0;
    })).map((function(it) {
      return {
        code: it.code,
        name: it.name,
        snap_qty: gsSq(it),
        status: 'queued'
      };
    }));
    var c = s && s.counts || {
      done: 0,
      failed: 0,
      unknown: 0,
      left: its.length
    };
    var n = its.length;
    var pct = s && s.pct >= 1 && s.pct <= 100 ? Number(s.pct) : first && first.pct >= 1 ? Number(first.pct) : gsPctIs(p);
    fin = !!(s && s.status === 'done');
    DLG_MSG.textContent = fin ? gsNameN(p, n) + ' 중 ' + c.done + '종목 팔았습니다' + (pct < 100 ? ' (보유 ' + pct + '%)' : '') : '📤 ' + gsName(p) + ' ' + (pct < 100 ? '보유 ' + pct + '% ' : '') + '파는 중 — ' + (n - c.left) + '/' + n;
    var w = el('div', 'gswrap');
    w.setAttribute('data-gs', String(my));
    var parts = [ gsHow(pct), '✅ 접수 ' + c.done ];
    if (c.failed) parts.push('❌ 실패 ' + c.failed);
    if (c.unknown) parts.push('⚠ 모름 ' + c.unknown);
    if (!fin) parts.push('남은 ' + c.left + '종목');
    w.appendChild(el('div', 'gshd', parts.join(' · ')));
    if (fin) {
      var badN = its.filter((function(x) {
        return x.status !== 'done' && x.status !== 'unknown';
      }));
      var unkN = its.filter((function(x) {
        return x.status === 'unknown';
      }));
      if (badN.length) w.appendChild(el('div', 'gshd bad', '❌ ' + badN.length + '종목 못 팔았습니다 — ' + badN.map((function(x) {
        return x.name || x.code;
      })).join(', ')));
      if (unkN.length) w.appendChild(el('div', 'gshd bad', '⚠ ' + unkN.length + '종목은 접수 여부를 모릅니다 — 증권사에서 확인해 주세요'));
    } else {
      var bar = el('div', 'gsbar'), fill = el('i');
      fill.style.width = Math.round((n - c.left) * 100 / Math.max(1, n)) + '%';
      bar.appendChild(fill);
      w.appendChild(bar);
    }
    var bl = gsBuysLine(first && first.buys || null, p);
    if (bl) w.appendChild(bl);
    if (late) w.appendChild(el('div', 'gshd', '⚠ 결과를 아직 다 못 받았습니다 — 컴퓨터는 계속 팝니다 · 매매 알림을 확인해 주세요'));
    var list = el('div', 'gslist');
    its.forEach((function(it) {
      list.appendChild(gsBoardRow(it));
    }));
    w.appendChild(list);
    DLG_PICK.textContent = '';
    DLG_PICK.appendChild(w);
    if (fin) {
      DLG_NO.style.display = 'none';
      DLG_OK.style.display = '';
      DLG_OK.className = 'p gsok';
      DLG_OK.textContent = '확인';
    } else {
      DLG_NO.style.display = '';
      DLG_NO.textContent = '닫기';
      DLG_OK.style.display = 'none';
    }
  }
  draw(null);
  DLG_CB = function() {
    GS_SEQ++;
    DLG_NO.style.display = '';
    if (!fin) toast('📤 컴퓨터가 끝까지 팝니다 — 결과는 매매 알림으로 옵니다', 3500, true);
    go(TAB);
  };
  (function poll() {
    if (!alive()) return;
    fetch(GS_URL + '/' + encodeURIComponent(bid), {
      headers: {
        Accept: 'application/json'
      },
      cache: 'no-store'
    }).then((function(r) {
      return r.json();
    })).then((function(s) {
      if (!alive()) return;
      if (s && s.ok !== false) draw(s);
      if (fin) return;
      if (Date.now() - t0 > GS_WAIT_MS) {
        draw(s && s.ok !== false ? s : null, true);
        return;
      }
      setTimeout(poll, GS_POLL_MS);
    })).catch((function() {
      if (alive()) setTimeout(poll, GS_POLL_MS * 2);
    }));
  })();
}

function gsOpenDone(p, j) {
  var res = j.results || [], day = soDay(j.run_date);
  var pct = j.pct >= 1 && j.pct <= 100 ? Number(j.pct) : gsPctIs(p);
  askPick('🌅 ' + gsNameN(p, res.length) + ' 중 ' + (j.n_ok || 0) + '종목 ' + day + ' 시가 매도 예약' + (pct < 100 ? '(보유 ' + pct + '%)' : '') + '을 걸었습니다', []);
  var w = el('div', 'gswrap');
  var bl = gsBuysLine(j.buys, p);
  if (bl) w.appendChild(bl);
  var list = el('div', 'gslist');
  res.forEach((function(x) {
    list.appendChild(gsBoardRow({
      code: x.code,
      name: x.name,
      status: x.ok ? 'open_ok' : 'failed',
      message: x.ok ? gsHow(pct) + ' · ' + day + ' 09:00 시가' : x.error || '못 걸었습니다'
    }));
  }));
  w.appendChild(list);
  DLG_PICK.appendChild(w);
  DLG_NO.style.display = 'none';
  DLG_OK.style.display = '';
  DLG_OK.className = 'p gsok';
  DLG_OK.textContent = '확인';
  DLG_CB = function() {
    DLG_NO.style.display = '';
    delete JC[SO_URL];
    soAfter();
  };
}

function beItem(cd, code, nm) {
  if (!cd || cd.ok === false) {
    var why = cd && cd.error || '답이 비었습니다';
    return [ '🛡 본전 상향', function() {
      beAsk(null, code, nm, why);
    }, false, {
      id: 'pk-be',
      sub: '가능한지 못 읽었습니다 (' + why + ') — 눌러도 컴퓨터가 그 자리에서 다시 확인합니다'
    } ];
  }
  var it = (cd.items || []).filter((function(x) {
    return String(x.code) === code;
  }))[0];
  if (!it) return [ '🛡 본전 상향 불가', null, false, {
    off: true,
    id: 'pk-be',
    sub: '지금 컴퓨터가 읽은 보유 목록에 이 종목이 없습니다'
  } ];
  if (!it.eligible) return [ '🛡 본전 상향 불가', null, false, {
    off: true,
    id: 'pk-be',
    sub: it.reason || '지금은 올릴 수 없습니다'
  } ];
  var tk = cd.ticks != null ? cd.ticks : '?';
  return [ '🛡 본전 상향', function() {
    beAsk(it, code, nm, '', tk);
  }, false, {
    id: 'pk-be',
    sub: '손절을 ' + fmt(it.breakeven) + '원(매수가 +' + tk + '틱)으로 올립니다'
  } ];
}

function beAsk(it, code, nm, why, tk) {
  var msg = '«' + nm + '» 손절을 본전으로 올립니다.\n\n';
  if (it) {
    var pl = Number(it.pl_rate || 0);
    msg += '· 새 손절 ' + fmt(it.breakeven) + '원 (매수가 ' + fmt(it.avg) + '원 + ' + tk + '틱)\n' + '· 지금 ' + fmt(it.cur) + '원 · 수익률 ' + (pl >= 0 ? '+' : '') + pl.toFixed(2) + '%\n\n' + '새 손절 이하로 걸린 손절은 이 하나(남은 수량 전부)로 바뀝니다.\n' + '새 손절보다 높게 걸린 손절·트레일링 선과 익절은 그대로 둡니다.\n' + '값이 새 손절까지 내려오면 남은 수량 전부를 시장가로 팝니다.' + (it.reason ? '\n\n※ ' + it.reason : '');
  } else {
    msg += '가능한지 미리 못 읽었습니다 (' + why + ').\n' + '누르면 컴퓨터가 그 자리에서 다시 확인하고, 안 되면 까닭을 알려 드립니다.';
  }
  ask(msg, (function() {

function fxShrink(file) {
  return new Promise((function(res) {
    if (!file || file.size < 15e5 || !window.URL || !document.createElement('canvas').toBlob) {
      res(file);
      return;
    }
    var u = URL.createObjectURL(file), im = new Image;
    im.onload = function() {
      try {
        var W = im.naturalWidth, H = im.naturalHeight, s = Math.min(1, 1600 / Math.max(W, H));
        var cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(W * s));
        cv.height = Math.max(1, Math.round(H * s));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob((function(b) {
          URL.revokeObjectURL(u);
          res(b && b.size ? b : file);
        }), 'image/jpeg', .85);
      } catch (e) {
        URL.revokeObjectURL(u);
        res(file);
      }
    };
    im.onerror = function() {
      URL.revokeObjectURL(u);
      res(file);
    };
    im.src = u;
  }));
}

function sellKindPaint(node) {
  if (!node) return false;
  var SELLK_RE = [ /(^|[\s«])(아래로익절|위로익절|손절|본절|매도)((?: · [^\s»]+?)?)(?=(?:\d+(?:\.\d+)?%|\d+주)(?:$|[\s»]))/, /^(· )(아래로익절|위로익절|손절|본절|매도)((?: · \S+)?)(?=\s|$)/ ];
  var kids = [].slice.call(node.childNodes);
  for (var i = 0; i < kids.length; i++) {
    var t = kids[i];
    if (t.nodeType !== 3) continue;
    var s = t.nodeValue, m = null;
    for (var j = 0; j < SELLK_RE.length && !m; j++) m = SELLK_RE[j].exec(s);
    if (!m) continue;
    var at = m.index + m[1].length, f = document.createDocumentFragment();
    if (at) f.appendChild(document.createTextNode(s.slice(0, at)));
    f.appendChild(el('b', 'sellk ' + sellKindCls(m[2]), m[2]));
    if (m[3]) f.appendChild(el('span', 'sellk-tag', m[3]));
    var rest = s.slice(at + m[2].length + m[3].length);
    if (rest) f.appendChild(document.createTextNode(rest));
    node.replaceChild(f, t);
    return true;
  }
  return false;
}
